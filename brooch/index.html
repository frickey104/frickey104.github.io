<h1>ブローチの見本</h1>
<p class="lead">3D プリンタで刷るブローチの、刷る前の見本の絵です（形はプログラムと AI で作りました）。どれも裏が平らで、ブローチピンを貼る凹みがあります。花の形は、Meshy（Meshy 6 Lite）で作った形をブローチ向けに加工したものです。</p>
