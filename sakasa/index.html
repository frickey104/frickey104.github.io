<style>
:root {

.win.menu { padding: 8px 10px 8px 6px; }
.win.menu .title { position: absolute; top: -0.9em; left: 10px; background: #000; padding: 0 6px; font-size: 13px; line-height: 1.5; color: var(--accent); }
.win.menu .list { display: grid; grid-template-columns: auto; gap: 0 10px; }

.win.endlist { left: 8px; right: 8px; top: 18%; bottom: auto; max-height: 60%; }

.pop.hurt { color: #ff8a6a; transform: none; } .pop.heal { color: #8af08a; transform: none; } .pop.miss { color: #c8c8c8; font-size: 17px; }
@keyframes pop { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; margin-top: -8px; } 30% { margin-top: -4px; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -14px; } }
#bigText { position: absolute; left: 0; right: 0; top: 30%; text-align: center; z-index: 4; font-size: 24px; letter-spacing: .1em; color: #f0d0c0; pointer-events: none;
  text-shadow: 2px 2px 0 #000; }
#bigText[hidden], #roll[hidden], #tapHint[hidden] { display: none; }
#roll { position: absolute; inset: 0; z-index: 4; overflow: hidden; text-align: center; font-size: 17px; line-height: 2; pointer-events: none;
  background: rgba(0,0,0,.78); }

.win.stats b { font-weight: normal; float: right; }
.win.titlemenu { left: 50%; transform: translateX(-50%); bottom: 12%; min-width: 10em; }
.win.msg.battle { min-height: 4.8em; }
.win.msg.battle .text { min-height: 3.1em; }
#titleText { position: absolute; left: 0; right: 0; top: 9%; text-align: center; z-index: 4; pointer-events: none; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
#titleText .t1 { font-size: clamp(26px, 8vw, 40px); font-weight: bold; letter-spacing: .08em; color: #f8e08a; }

  #controls { height: auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); justify-content: center; gap: 16px; }
  #dpad, #btns { display: none; }
  #btnMute { position: static; transform: none; min-height: 32px; font-size: 13px; }
  #keyHint { display: block; color: #9a9aa8; font-size: 13px; }
}
/* スマホ横持ち：ボタンを画面の左右へ */
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
  :root { --pad-size: min(40vh, 150px); --btn: min(17vh, 68px); }
  #app { max-width: none; padding: env(safe-area-inset-top) calc(var(--pad-size) + 28px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(var(--pad-size) + 28px + env(safe-area-inset-left)); }

<body>
<div id="app">
  <div id="timebar" class="off" role="img" aria-label="時間の ゲージ"><span class="from"></span><span class="track"><span class="mk"><i class="dot"></i><b class="ar">▶</b></span></span><span class="to"></span></div>
  <div id="stage">
    <canvas id="screen" width="192" height="192" aria-label="ゲーム画面"></canvas>
    <div id="titleText" hidden><div class="t1"></div><div class="t2"></div></div>
    <div id="bigText" hidden></div>
    <div id="roll" hidden></div>
    <div id="tapHint" hidden>▼</div>
  </div>
  <div id="controls">
    <div id="dpad" role="group" aria-label="十字キー">
      <div class="arm u">▲</div><div class="arm d">▼</div><div class="arm l">◀</div><div class="arm r">▶</div><div class="c"></div>
    </div>
    <button id="btnMute" type="button" aria-pressed="false">音 ON</button>
    <div id="keyHint">矢印：いどう　Z/Enter：けってい　X/Esc：メニュー　M：音</div>
    <div id="btns">
      <button class="rbtn" id="btnA" type="button" aria-label="A 決定・話す">A<small>けってい</small></button>
      <button class="rbtn" id="btnB" type="button" aria-label="B キャンセル・メニュー">B<small>メニュー</small></button>
    </div>
  </div>
</div>
<script>
// =====================================================================
//  STORY_ART — 『さかさまの三日間』用の絵・人物・敵・一枚絵、
//  そして物語用の戦闘（コマンドの差し替え・仲間・記録の再生）。
//  build.js で data.js の直前に入る（art.js / engine.js より前）。
//  ※ PALETTE・HEADS などの art.js の値は「呼ばれたとき」にだけ使う。
// =====================================================================
const STORY = { card: '', look: 'kai' };

// ---- 色の反転（うら色）。CSS の invert(1) と同じ計算なので、二重にかけると元の色にもどる ----
function invHex(h) {
  if (!h || h[0] !== '#') return h;
  let s = h.slice(1); if (s.length === 3) s = s.split('').map(x => x + x).join('');
  const n = 0xffffff - parseInt(s, 16);
  return '#' + n.toString(16).padStart(6, '0');
}
function invPal(pal) {
  const out = {};
  for (const [k, v] of Object.entries(PALETTE)) out[k] = invHex(v);
  for (const [k, v] of Object.entries(pal || {})) out[k] = invHex(v);
  return out;
}

// ---- 人物（色の役: h髪 H髪影 c服 C服影 a帯 p脚 f靴 m/M仮面） ----
const STORY_CHAR_BASE = {
  kai:      { head: 'short', body: 'pants', pal: { h: '#3e2a1a', H: '#22140a', c: '#4a6a3a', C: '#2a4020', a: '#b0743a', p: '#3a3446', f: '#4a2a14' } },
  kai_mask: { head: 'mask',  body: 'pants', pal: { h: '#3e2a1a', H: '#22140a', c: '#4a6a3a', C: '#2a4020', a: '#b0743a', p: '#3a3446', f: '#4a2a14', m: '#f8f8f0', M: '#d03c28' } },
  kai_hood: { head: 'hood',  body: 'robe',  pal: { c: '#6a6a70', C: '#3a3a40', a: '#3a3a40', f: '#1a1a1a' } },
  mio:      { head: 'long',  body: 'robe',  pal: { h: '#2a1a12', H: '#100804', c: '#e05a3a', C: '#982a1a', a: '#f8e08a', f: '#6a3e1c' } },
  mio_hk:   { head: 'hood',  body: 'robe',  pal: { c: '#8a8478', C: '#5a554c', a: '#e05a3a', f: '#6a3e1c' } },
  sayo:     { head: 'long',  body: 'robe',  pal: { h: '#1a1a2a', H: '#000010', c: '#5aa08a', C: '#2a6050', a: '#f8f0d0', f: '#3e220e' } },
  soh:      { head: 'short', body: 'pants', pal: { h: '#5a3a1a', H: '#2a1a0a', c: '#4a7ac8', C: '#22427a', a: '#d8c070', p: '#4a4050', f: '#2a1a0a' } },
  toki:     { head: 'long',  body: 'robe',  pal: { h: '#e8e4dc', H: '#a8a49c', c: '#6a4a8a', C: '#3a2a5a', a: '#d6b462', f: '#2a1a0a' } },
  gen:      { head: 'beard', body: 'pants', pal: { h: '#7a7a70', H: '#4a4a40', c: '#8a6a3a', C: '#5a4020', a: '#3a3a3a', p: '#4a4040', f: '#2a1a0a' } },
  vman:     { head: 'short', body: 'pants', pal: { h: '#2a2a2a', H: '#101010', c: '#a08a5a', C: '#6a5a3a', a: '#5a3a1a', p: '#57524a', f: '#3e220e' } },
  vwoman:   { head: 'long',  body: 'robe',  pal: { h: '#4a2a1a', H: '#2a140a', c: '#c87a9a', C: '#8a4a6a', a: '#f8e08a', f: '#6a3e1c' } },
  vold:     { head: 'beard', body: 'robe',  pal: { h: '#d8d8d0', H: '#9a9a90', c: '#7a6a5a', C: '#4a3a2a', a: '#b0743a', f: '#3e220e' } },

// ---- 敵（戦闘画面） ----
// 形（楕円・線）で塗ってから、ふちの影・輪郭を自動で付けて「1文字=1ドット」の行にする。
// どの敵にも「戦う理由」が見えるように描く（荒れた作物・やせた体・たまご・ひな・鐘の音）。
function SG(w, h) {
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? '.' : g[y][x];
  const S = {
    w, h, g, at,
    px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; return S; },
    ell(cx, cy, rx, ry, c) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) g[y][x] = c; } return S; },
    rect(x, y, ww, hh, c) { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) S.px(i, j, c); return S; },
    line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) S.px(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); return S; },
    poly(pts, c) { // 塗りつぶしの多角形
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let ins = false; const px = x + 0.5, py = y + 0.5;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
        }
        if (ins) g[y][x] = c;
      } return S;
    },
    // from の色のうち、(dx,dy) の先が外（透明）のドットを to にする＝ふちの影・光
    rim(from, to, dx, dy) { const hit = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (from.includes(g[y][x]) && at(x + dx, y + dy) === '.') hit.push([x, y]); hit.forEach(([x, y]) => g[y][x] = to); return S; },
    // 下のほうほど暗く（y >= y0 の from を to に、まだらに）
    low(from, to, y0, dither = true) { for (let y = Math.ceil(y0); y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === from && (!dither || y >= y0 + 2 || (x + y) % 2)) g[y][x] = to; return S; },
    outline(c = 'k') { const add = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => at(x + a, y + b) !== '.' && at(x + a, y + b) !== c)) add.push([x, y]); add.forEach(([x, y]) => g[y][x] = c); return S; },
    rows() { return g.map(r => r.join('')); },
  };
  return S;
}

// どろだま：畑の泥が、ふみ荒らされた苗をかかえて起きあがったもの。うつろな目から泥のすじ
function spDorodama() {
  const S = SG(16, 16);
  S.ell(8, 10.5, 7, 5.2, 'n').ell(7.5, 6.5, 4.5, 3.5, 'n').ell(11, 8, 3, 3, 'n');
  S.rim('n', 'u', -1, 0).rim('n', 'u', 0, -1).low('n', 'N', 11).low('u', 'N', 13).low('N', 'H', 14);
  S.outline('k');
  S.px(4, 15, 'H').px(11, 15, 'H').px(12, 14, 'k');
  // 目（くぼみ）と、目の下へ流れる泥
  S.rect(4, 8, 2, 2, 'k').px(5, 8, 'z').rect(9, 8, 2, 2, 'k').px(10, 8, 'z');
  S.px(4, 10, 'H').px(4, 11, 'H').px(10, 10, 'H').px(10, 11, 'H').px(10, 12, 'H');
  S.px(6, 12, 'k').px(7, 12, 'k').px(5, 13, 'H');
  // 折れた苗（輪郭なし）
  S.line(6, 3, 6, 0, 'T').px(5, 1, 'Q').px(7, 1, 'Q').line(10, 4, 11, 1, 'G').px(12, 1, 'G').px(12, 2, 'd');
  return S.rows();
}
// やまいぬ：あばらの浮いた、やせた犬。頭を低くし、しっぽを足のあいだへ
function spYamainu() {
  const S = SG(24, 18);
  S.ell(13, 8, 8, 3.4, 'g');                           // 胴（細い）
  S.ell(5, 10, 3.8, 3.2, 'g').poly([[0.5, 10], [3, 9], [3, 13], [0, 12.5]], 'g'); // 頭（低く）・鼻づら
  S.poly([[5, 5.5], [8, 8], [4, 8.5]], 'g');          // 耳（寝ている）
  S.rect(7, 8, 3, 3, 'g');
  [[8, 10], [10, 10], [17, 10], [19, 10]].forEach(([x, y]) => S.rect(x, y, 2, 7, 'g')); // 足（細く長い）
  S.line(21, 7, 22, 10, 'g').line(22, 10, 20, 14, 'g');  // しっぽ（足のあいだへ）
  S.rim('g', 'x', 0, -1).low('g', 'G', 10).low('G', 'd', 14);
  S.outline('k');
  for (let x = 11; x <= 17; x += 2) S.line(x, 7, x, 9, 'G');  // あばら
  S.px(3, 9, 'y').px(4, 9, 'k').px(3, 10, 'G').px(0, 10, 'k').px(1, 12, 'k').px(2, 12, 'k'); // 目（にぶい光）・鼻・口
  S.px(9, 17, 'k').px(18, 17, 'k');
  return S.rows();
}
// とげがに：ひびの入った甲羅。うしろの岩かげに たまご

}

// がけワシ：翼を広げ、足もとの巣のひなを守る。古い傷あと

  S.px(14, 5, 'k').px(15, 5, 'k').px(14, 4, 'G').line(4, 6, 7, 9, 'R').line(27, 5, 25, 8, 'R');

// ---- 人物の敵（24×22、4倍で表示）。色の役は人物と同じ（h髪 c服 a帯 p脚 f靴 s肌 m/M仮面） ----
function spFigure(o) {
  const S = SG(24, 22);
  const hx = 12, hy = o.small ? 6.2 : 5.2;
  // 足・胴
  const legY = o.small ? 15 : 14;
  S.poly([[9, legY], [12, legY], [11.5, 21], [8, 21]], 'p').poly([[12, legY], [15, legY], [16, 21], [12.5, 21]], 'p');
  S.rect(7, 20, 4, 2, 'f').rect(13, 20, 4, 2, 'f');
  S.poly([[8, hy + 3.5], [16, hy + 3.5], [17, legY + 1], [7, legY + 1]], 'c');
  S.rect(7, legY - 1, 10, 2, 'a');
  if (o.cloak) S.poly([[7, hy + 3.5], [3, 17], [5, 19], [8, 16]], 'C').poly([[16, hy + 3.5], [20, 18], [17.5, 19], [16, 15]], 'C');
  // 腕
  (o.arms || []).forEach(([x0, y0, x1, y1]) => { S.line(x0, y0, x1, y1, 'c'); S.line(x0 + 1, y0, x1 + 1, y1, 'C'); S.px(x1, y1 + 1, 's').px(x1 + 1, y1 + 1, 's'); });
  // 頭
  S.ell(hx, hy, 3.6, 3.8, 's');
  S.rim('c', 'C', 1, 0).low('c', 'C', legY - 2).rim('p', 'j', 1, 0).rim('s', 'S', 1, 0);
  // 武器（輪郭の前に塗ると、輪郭も付く）
  if (o.sword) { const [x0, y0, x1, y1] = o.sword; S.line(x0, y0, x1, y1, 'x'); S.line(x0 + 1, y0, x1 + 1, y1, 'g'); }
  if (o.spear) { const [x0, y0, x1, y1] = o.spear; S.line(x0, y0, x1, y1, 'N'); const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0); S.px(x1 + dx, y1 + dy, 'x').px(x1 + dx * 2, y1 + dy * 2, 'w').px(x1 + dx, y1, 'g').px(x1, y1 + dy, 'g'); }
  S.outline('k');
  // 髪
  S.ell(hx, hy - 2.2, 4.2, 2.4, 'h').px(hx - 4, hy - 1, 'h').px(hx + 4, hy - 1, 'H').px(hx + 3, hy, 'H').px(hx - 3, hy - 4, 'k').px(hx + 2, hy - 5, 'h');
  S.rim('h', 'H', 0, 1);
  const ey = Math.round(hy + 0.5);
  if (o.mask) { // 仮面：白に赤いすじ。目は細い切れこみ
    S.rect(hx - 3, ey - 1, 7, 4, 'm').px(hx - 2, ey, 'k').px(hx + 2, ey, 'k').px(hx - 3, ey + 1, 'M').px(hx + 3, ey + 1, 'M').px(hx, ey + 2, 'M');
  } else {
    S.px(hx - 2, ey, 'k').px(hx + 1, ey, 'k');
    if (o.brow) S.px(hx - 2, ey - 1, 'H').px(hx + 1, ey - 1, 'H');
    if (o.tear) S.px(hx - 2, ey + 1, 'C').px(hx - 2, ey + 2, 'C');
    S.px(hx - 1, ey + 2, 'S').px(hx, ey + 2, 'S');
  }
  if (o.band) S.line(hx - 4, hy - 2, hx + 4, hy - 2, 'a').px(hx + 5, hy - 1, 'a').px(hx + 6, hy, 'a');
  if (o.wound) S.px(15, o.wound, 'r').px(16, o.wound + 1, 'r').px(15, o.wound + 1, 'R');
  return S.rows();
}

function grad(c, w, h, stops, y0 = 0, y1 = h) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  c.fillStyle = g; c.fillRect(0, y0, w, y1 - y0);
}
function drawTower(c, P, cx, base, s, col, lit) {
  // 細い石の塔。上に鐘楼、なかほどに門の窓
  P.rect(c, cx - 9 * s, base - 70 * s, 18 * s, 70 * s, col);
  P.rect(c, cx - 11 * s, base - 74 * s, 22 * s, 4 * s, col);

    const cx = w / 2, cy = h * 0.3, r = 16;
    P.circle(c, cx, cy, r + 2, '#d6b462'); P.circle(c, cx, cy, r, '#14141c');
    const ang = (back ? -1 : 1) * t * 2.4 - Math.PI / 2;
    for (let i = 0; i < r - 3; i++) P.rect(c, cx + Math.cos(ang) * i, cy + Math.sin(ang) * i, 1, 1, '#f8f0d8');
    for (let i = 0; i < 8; i++) P.rect(c, cx + Math.cos(ang / 12) * i, cy + Math.sin(ang / 12) * i, 2, 2, '#f8f0d8');
    c.globalAlpha = 1;
  },
  ...STORY_PICTURES_SCENES,
};

async function bell(b, text) {
  b.bells = (b.bells || 0) + 1; if (b.bells === 2) b.bell2 = true;
  Sound.sfx('shake'); if (!reducedMotion()) { G.shake.t = 0.5; G.shake.power = 4; }
  await blog(text);
  await blog(`……ゴォォン（${['ひとつめ', 'ふたつめ', 'みっつめ'][b.bells - 1]}）`);
}
async function partyAct(b, who, force) {
  const h = G.hero, live = b.enemies.filter(e => e.alive);
  if (!live.length) return;
  if (who === 'soh') {
    const e = live[0];
    await blog('ソウの やりの ひとつき！');
    await damageEnemy(b, e, calcDamage(h.atk * 0.8, e.def));
  } else if (who === 'sayo') {
    if (h.hp < h.mhp * 0.6 || force) {
      const v = Math.min(h.mhp - h.hp, rint(14, 20)); h.hp += v; Sound.sfx('heal'); updateBattleStatus(); heroPopup('+' + v, 'heal');
      await blog(`サヨの くすり！ カイの HPが ${v} かいふくした！`);
    }
  } else if (who === 'mio') {
    if (h.hp < h.mhp * 0.5) {
      const v = Math.min(h.mhp - h.hp, rint(9, 13)); h.hp += v; Sound.sfx('heal'); updateBattleStatus(); heroPopup('+' + v, 'heal');
      await blog(`ミオの おまじない！ カイの HPが ${v} かいふくした！`);
    }
  }
}
async function sbCommand(b, H, opt) {
  const h = G.hero;
  closeMessage();
  const cmds = H.cmds || opt.cmds || ['attack', 'guard', 'item', 'run'];
  const dis = H.dis || [];
  for (; ;) {
    updateEnemyWin(b); b.enemyEl.hidden = false;
    let hint = b.hintNext ?? H.hint;
    const start = b.startNext; b.startNext = undefined;
    if (hint === undefined && !G.flags._tutCmd) hint = 0;
    b.hintNext = undefined;
    const items = cmds.map(k => ({ text: CMD_NAMES[k], disabled: dis.includes(k) }));
    const c = await menu(items, { cls: 'command', cols: 2, battle: true, autoDefault: cmds.findIndex(k => !dis.includes(k) && k !== 'remember'), title: h.name, hint, start });
    b.enemyEl.hidden = true;
    const k = cmds[c];
    if (k === 'attack') { G.flags._tutCmd = true; const t = await pickTarget(b); if (t) return { type: 'attack', target: t }; continue; }
    if (k === 'guard') {
      if (H.guardDir) {
        const i = await menu(['みぎ', 'ひだり', 'うえ'], { cls: 'sub', cancel: -1, battle: true, title: 'どちらを まもる？' });
        if (i < 0) continue;
        return { type: 'guard', dir: 'RLU'[i] };
      }
      return { type: 'guard' };
    }
    if (k === 'item') {
      const ids = Object.keys(G.items).filter(id => DATA.items[id].battle);
      if (!ids.length) { await blog('つかえる どうぐを もっていない。'); closeMessage(); continue; }
      const i = await menu(ids.map(id => ({ text: DATA.items[id].name, sub: '×' + G.items[id] })), { cls: 'sub', cancel: -1, battle: true, title: 'どうぐ' });
      if (i < 0) continue;
      return { type: 'item', id: ids[i] };
    }
    if (k === 'remember') { await H.remember(b); closeMessage(); b.hintNext = b.startNext = cmds.indexOf('guard'); continue; }
    if (k === 'call') return { type: 'call' };
    return { type: 'run' };
  }
}
async function sbEnemy(b, e, H) {
  const d = e.def0, h = G.hero;
  const gm = b.guard ? 0.45 : 1;
  if (e.charge > 0) {
    e.charge = 0;
    const ca = d.chargeAttack || {};
    await blog(fmt(ca.text || `${e.name}の ちからを こめた いちげき！`));
    const dmg = calcDamage(e.atk, h.def, (ca.mul || 2.5) * (b.guard ? 0.3 : 1));
    heroHit(dmg); Sound.sfx('hurt');
    await blog(b.guard ? `みを まもった！ ${h.name}は ${dmg}の ダメージで すんだ。` : `${h.name}は ${dmg}の ダメージを うけた！`);
    return;
  }
  const acts = d.actions || [{ type: 'attack', w: 1 }];
  const tot = acts.reduce((s, a) => s + (a.w || 1), 0);
  let r = Math.random() * tot, a = acts[0];
  for (const x of acts) { r -= (x.w || 1); if (r <= 0) { a = x; break; } }
  if (a.type === 'charge') { e.charge = 1; await blog(fmt(a.text || `${e.name}は ちからを ためている……`), 'magic'); if (H.afterCharge) await H.afterCharge(b); return; }
  if (a.type === 'say') { await blog(fmt(a.text)); return; }
  await blog(a.type === 'spell' ? fmt(a.text || `${e.name}の こうげき！`) : `${e.name}の こうげき！`);
  if (Math.random() < (d.missRate ?? 0.06)) { await blog(`${h.name}は ひらりと みをかわした！`, 'miss'); return; }
  const dmg = calcDamage(e.atk, h.def, (a.mul || 1) * gm);
  heroHit(dmg); Sound.sfx('hurt');
  await blog(`${h.name}は ${dmg}の ダメージを うけた！`);
}
async function storyBattle(ids, opt = {}) {
  const prevMode = G.mode, prevBgm = Sound.bgmId;
  G.stats.battles++;
  const h = G.hero, H = BATTLE_STORY[opt.story] || {};
  Sound.sfx('encounter');
  if (!G.auto && !reducedMotion() && G.mode === 'map' && G.fade.a < 0.5) { for (let i = 0; i < 2; i++) { await fadeTo(0.85, 0.05, '#fff'); await fadeTo(0, 0.05); } }
  if (!G.auto) await fadeTo(1, 0.25, '#000');
  const b = G.battle = { enemies: ids.map((id, i, a) => makeEnemy(id, i, a)), turn: 0, history: [], allies: [], skip: 0,
    bg: opt.bg || (G.map && G.map.def.battleBg) || 'field', canRun: opt.canRun ?? !opt.boss, hitT: 0, hurtT: 0, opt };
  const party = H.party || opt.party || String(G.flags.party || '').split(',').filter(Boolean);
  b.statusEl = infoWin('status', ''); updateBattleStatus();
  b.enemyEl = infoWin('enemies', ''); b.enemyEl.hidden = true; updateEnemyWin(b);
  G.mode = 'battle';
  Sound.bgm(opt.bgm || (opt.boss ? 'boss' : DATA.battleBgm || 'battle'));
  if (!G.auto) await fadeTo(0, 0.25);
  const alive = () => b.enemies.filter(e => e.alive);
  const names = [...new Set(b.enemies.map(e => DATA.enemies[e.id].name))];
  await blog(opt.intro || (b.enemies.length > 1 ? `${names.join('と ')}たちが あらわれた！` : `${b.enemies[0].name}が あらわれた！`));
  if (opt.tutorial) await battleTutorial(opt);
  if (H.start) await H.start(b);
  let result = null;
  while (!result) {
    b.turn++;
    const act = await sbCommand(b, H, opt);
    b.guard = act.type === 'guard' ? (act.dir || true) : null;
    if (act.type === 'attack') {
      if (H.attack) await H.attack(b, act.target);
      else {
        const e = act.target.alive ? act.target : alive()[0];
        await blog(`${h.name}の こうげき！`);
        const crit = Math.random() < 1 / 24;
        if (crit) await blog('かいしんの いちげき！', 'magic');
        await damageEnemy(b, e, crit ? Math.round(h.atk * rnd(0.95, 1.05)) : calcDamage(h.atk, e.def));
      }
    } else if (act.type === 'guard') await blog(act.dir ? `カイは ${DIRN[act.dir]}を まもって かまえた。` : `${h.name}は みを まもっている。`);
    else if (act.type === 'item') { const it = DATA.items[act.id]; giveItem(act.id, -1); await blog(`${h.name}は ${it.name}を つかった！`); await useItemEffect(it); }
    else if (act.type === 'call') await H.call(b);
    else if (act.type === 'run') {
      await blog(`${h.name}は にげだした！`, 'run');
      const fast = alive().reduce((m, e) => Math.max(m, e.agi), 0);
      if (b.canRun && Math.random() < clamp(0.55 + (h.agi - fast) * 0.05, 0.3, 0.9)) result = 'run';
      else await blog(b.canRun ? 'しかし まわりこまれて しまった！' : 'しかし にげられない！');
    }
    if (!result && !b.end) for (const p of party) { if (!alive().length) break; await partyAct(b, p); }
    if (!result && !b.end && alive().length) for (const e of alive()) {
      if (b.end || h.hp <= 0) break;
      if (H.enemy) await H.enemy(b, e); else await sbEnemy(b, e, H);
    }
    if (!result && !b.end && H.turnEnd) await H.turnEnd(b);
    if (!result) result = b.end || (h.hp <= 0 ? 'lose' : (!alive().length ? 'win' : null));
  }
  if (H.beforeEnd && result === 'win') await H.beforeEnd(b);
  if (result === 'win') {
    const exp = b.enemies.reduce((s, e) => s + e.exp, 0), gold = b.enemies.reduce((s, e) => s + e.gold, 0);
    Sound.bgm(null); Sound.sfx('win');
    if (H.winText) for (const t of H.winText(b)) await blog(t); else await blog(`${names.join('と ')}を やっつけた！`);
    if (exp || gold) {
      h.exp += exp; h.gold += gold;
      await blog(`けいけんち ${exp}ポイント かくとく。${gold ? gold + 'ゴールドを てにいれた。' : ''}`);
      const msgs = []; checkLevelUp(msgs);
      for (const m of msgs) { updateBattleStatus(); await blog(m.t, m.snd); }
    }
    for (const e of b.enemies) { const dr = e.def0.drop; if (dr && Math.random() < (dr.rate ?? 1)) { giveItem(dr.item); await blog(`${e.name}は ${DATA.items[dr.item].name}を おとした！`, 'item'); } }
  } else if (result === 'lose') {
    if (H.loseText) for (const t of H.loseText(b)) await blog(t, 'lose'); else await blog(`${h.name}は ちからつきた……`, 'lose');
  }
  closeMessage();
  b.statusEl.remove(); b.enemyEl.remove();
  document.querySelectorAll('.pop').forEach(e => e.remove());
  if (!G.auto) await fadeTo(1, 0.25);
  G.battle = null; G.mode = prevMode === 'battle' ? 'map' : prevMode;
  Sound.bgm(prevBgm);
  if (!G.auto) await fadeTo(0, 0.25);
  if (result !== 'lose') autosave();
  return result;
}

    flags: Object.assign({}, G.flags, { _cp: undefined }), items: Object.assign({}, G.items), skills: G.skills.slice() });

// 結末のあとの「つづきから」用：鐘楼の まえ（門の奥・さかさ）の状態を 保存する（いまの G は こわさない）
function storyClearSave() {
  if (!G.flags._cp) return false;
  const keep = { hero: Object.assign({}, G.hero), flags: G.flags, items: G.items, skills: G.skills, map: G.map, rev: G.reversed };
  try {
    storyRestore();
    Object.assign(G.flags, { look: 'kai_u' }); delete G.flags._resume;
    G.map = buildMap('tower'); G.hero.x = 2; G.hero.y = 1; G.hero.dir = 'down'; G.reversed = true;
    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
    return true;
  } catch (e) { return false; }
  finally { Object.assign(G.hero, keep.hero); G.flags = keep.flags; G.items = keep.items; G.skills = keep.skills; G.map = keep.map; G.reversed = keep.rev; }
}
function storyRestore() {
  const s = JSON.parse(G.flags._cp || 'null'); if (!s) return false;
  const cp = G.flags._cp;
  Object.assign(G.hero, s.hero);
  const keep = {}; for (const k of Object.keys(G.flags)) if (k.startsWith('_ending') || k === '_cleared') keep[k] = G.flags[k];
  G.flags = Object.assign({}, s.flags, keep, { _cp: cp });
  G.items = s.items; G.skills = s.skills;
  return true;
}

    } else {

      const pal = c.pal;

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(tok);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
function parseVoice(str) {
  const toks = str.split(/\s+/).filter(t => t && t !== '|');
  const ev = [];
  toks.forEach((t, i) => {
    if (t === '-') { if (ev.length && ev[ev.length - 1].end === i) ev[ev.length - 1].end = i + 1; }
    else if (t !== '.') ev.push({ start: i, end: i + 1, f: noteFreq(t) });
  });
  const L = toks.length;
  const rev = ev.map(e => ({ start: L - e.end, end: L - e.start, f: e.f })).sort((a, b) => a.start - b.start);
  return { len: L, fwd: ev, rev };
}
const Sound = {
  ctx: null, master: null, muted: false, bgmId: null, track: null, step: 0, nextT: 0,
  init() {
    try { const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); this.muted = !!p.muted; } catch (e) { /* 無視 */ }
  },
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.6;
        this.master.connect(this.ctx.destination);
        if (this.bgmId) { const id = this.bgmId; this.bgmId = null; this.bgm(id); }
      }
      if (this.ctx.state === 'suspended' && !G.paused) this.ctx.resume();
    } catch (e) { /* 音なしで続行 */ }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.6;
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ muted: m })); } catch (e) { /* 無視 */ }
  },
  tone(f, dur, wave = 'square', vol = 0.15, when = 0, slide = 0) {
    const c = this.ctx; if (!c || !f) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = wave; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, when = 0, freq = 1200) {

    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const flt = c.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  sfx(name) {

    if (custom) { custom.forEach(([f, d, w, v, at, sl]) => this.tone(f, d, w || 'square', v || 0.12, at || 0, sl || 0)); return; }
    switch (name) {
      case 'select': this.tone(880, 0.06, 'square', 0.1); this.tone(1320, 0.07, 'square', 0.08, 0.05); break;
      case 'cursor': this.tone(660, 0.03, 'square', 0.06); break;
      case 'text': this.tone(1200, 0.02, 'square', 0.03); break;

      case 'stairs': [523, 440, 392, 330].forEach((f, i) => this.tone(f, 0.07, 'square', 0.08, i * 0.06)); break;
      case 'hit': this.noise(0.12, 0.35, 0, 2400); this.tone(180, 0.1, 'square', 0.12, 0, 60); break;
      case 'hurt': this.noise(0.2, 0.35, 0, 600); this.tone(90, 0.2, 'sawtooth', 0.12, 0, 40); break;
      case 'miss': this.tone(300, 0.1, 'triangle', 0.1, 0, 600); break;
      case 'heal': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.12, i * 0.07)); break;
      case 'magic': [1047, 784, 1319, 988].forEach((f, i) => this.tone(f, 0.08, 'square', 0.07, i * 0.05)); break;
      case 'item': [784, 988, 1175].forEach((f, i) => this.tone(f, 0.12, 'square', 0.08, i * 0.09)); break;
      case 'chest': this.noise(0.06, 0.15, 0, 1500); [659, 784, 1047].forEach((f, i) => this.tone(f, 0.1, 'square', 0.08, 0.06 + i * 0.08)); break;
      case 'levelup': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.14, 'square', 0.09, i * 0.1)); break;
      case 'run': [880, 660, 440].forEach((f, i) => this.tone(f, 0.06, 'square', 0.07, i * 0.05)); break;
      case 'encounter': [220, 330, 220, 440, 330, 660].forEach((f, i) => this.tone(f, 0.05, 'square', 0.09, i * 0.045)); break;
      case 'reverse': this.tone(1600, 0.9, 'sawtooth', 0.06, 0, 80); this.tone(800, 0.9, 'square', 0.05, 0.1, 1600); this.noise(0.6, 0.08, 0.2, 3000); break;
      case 'win': [784, 784, 784, 1047].forEach((f, i) => this.tone(f, i === 3 ? 0.4 : 0.1, 'square', 0.09, i * 0.12)); break;
      case 'lose': [392, 370, 349, 330].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.12, i * 0.28)); break;

  bgm(id) {

const Input = {

  release(k) { this.held[k] = false; if (DIRS[k]) this.dirStack = this.dirStack.filter(d => d !== k); },

  take(k) { if (this.pressed[k]) { this.pressed[k] = false; return true; } return false; },
  // 短いタップ（押してすぐ離す）でも1歩は進むように、最後に押した向きを1回分おぼえておく

function setupTouch() {

    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return cur; // 中心付近は直前の向きを保つ
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  };

  pad.addEventListener('pointermove', e => { if (e.pointerId === padPointer) setDir(dirAt(e)); });
  const end = e => { if (e.pointerId === padPointer) { padPointer = null; setDir(null); } };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => pad.addEventListener(t, end));
  // タブを隠す・窓を離れると Input.releaseAll() で 向きが消えるので、十字キーの 覚えている向きも 消す（戻ったあと 指を動かせば また押せる）

  addEventListener('blur', padReset);
  document.addEventListener('visibilitychange', padReset);
  for (const [id, k] of [['#btnA', 'a'], ['#btnB', 'b']]) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); Input.press(k); });
    const up = () => { el.classList.remove('on'); Input.release(k); };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, up));
  }
  $('#btnMute').addEventListener('click', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); updateMuteBtn(); });
  addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !e.repeat) { Sound.unlock(); Sound.setMuted(!Sound.muted); updateMuteBtn(); } });
  // 画面（会話の窓・一枚絵）をタップ＝A。押しっぱなしで早送り。マップ上のタップは何もしない（誤操作防止）

  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });

//  窓（DOM）：会話・選択肢・メニュー

const UI = {

function makeWin(cls) { const d = document.createElement('div'); d.className = 'win ' + (cls || ''); d.hidden = true; $('#stage').appendChild(d); return d; }
const msgWin = makeWin('msg');

// 会話：1文字ずつ表示。A（または窓のタップ）で全文→次へ。押しっぱなしで早送り。
// まだ出ていない文字は透明で先に置いておくので、表示中に行がガタガタ折り返し直さない。
function message(text, opt = {}) {
  return new Promise(res => {
    const chars = Array.from(fmt(text));
    const nameEl = msgWin.querySelector('.name'), more = msgWin.querySelector('.more');
    const shownEl = msgWin.querySelector('.shown'), restEl = msgWin.querySelector('.rest');
    const name = opt.name ? fmt(opt.name) : '';
    nameEl.textContent = name; nameEl.hidden = !name;
    msgWin.hidden = false; msgWin.classList.toggle('battle', G.mode === 'battle');
    more.style.visibility = 'hidden';
    let shown = 0, tick = 0, done = false, holdT = 0;
    const speed = opt.speed || DATA.textSpeed || 40;
    const show = n => { shownEl.textContent = chars.slice(0, n).join(''); restEl.textContent = chars.slice(n).join(''); };
    const w = {
      kind: 'msg',
      update(dt) {
        if (!done) {
          const before = Math.floor(shown);
          shown = G.auto ? chars.length : shown + dt * speed * (Input.fast() ? 6 : 1);
          if (Input.take('a') || Input.take('b')) shown = chars.length;
          const n = Math.min(chars.length, Math.floor(shown));
          if (n !== before) { show(n); if ((tick++ % 3) === 0 && n < chars.length) Sound.sfx('text'); }
          if (n >= chars.length) { done = true; show(chars.length); }
          return;
        }
        holdT += dt;
        if (opt.noWait) { finish(); return; }
        more.style.visibility = (opt.choiceNext || (holdT % 1 > 0.5 && !reducedMotion())) ? 'hidden' : 'visible';
        const ff = Input.fast() && holdT > 0.12 && !opt.choiceNext;
        if (G.auto || ff || (opt.autoClose && holdT > (Input.fast() ? 0.15 : opt.autoClose)) || Input.take('a') || Input.take('b')) { if (!G.auto && !opt.autoClose && !ff) Sound.sfx('cursor'); finish(); }
      },
    };
    function finish() { UI.remove(w); more.style.visibility = 'hidden'; if (!opt.keep) msgWin.hidden = true; res(); }
    show(0);
    UI.push(w);
  });
}
function closeMessage() { msgWin.hidden = true; }

// メニュー／選択肢：items は文字列 or {text, disabled, sub}
function menu(items, opt = {}) {
  return new Promise(res => {
    const el = makeWin('menu ' + (opt.cls || 'choice'));
    if (opt.title) { const t = document.createElement('div'); t.className = 'title'; t.textContent = opt.title; el.appendChild(t); }
    const list = document.createElement('div'); list.className = 'list'; if (opt.cols) list.style.gridTemplateColumns = `repeat(${opt.cols}, auto)`;
    el.appendChild(list);
    const norm = items.map(it => typeof it === 'string' ? { text: it } : it);
    const rows = norm.map((it, i) => {
      const r = document.createElement('div'); r.className = 'item' + (it.disabled ? ' dis' : '');
      r.innerHTML = '<span class="cur">▶</span><span class="t"></span>' + (it.sub ? '<span class="sub"></span>' : '');
      r.querySelector('.t').textContent = it.text; if (it.sub) r.querySelector('.sub').textContent = it.sub;
      r.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Sound.unlock(); idx = i; draw(); pick(); });
      list.appendChild(r); return r;
    });
    el.hidden = false;
    let idx = clamp(opt.start || 0, 0, norm.length - 1);
    const cols = opt.cols || 1;
    const draw = () => { rows.forEach((r, i) => r.classList.toggle('sel', i === idx)); if (opt.onMove) opt.onMove(idx); };
    if (opt.hint !== undefined && rows[opt.hint]) rows[opt.hint].classList.add('hint'); // はじめての人向けに光らせる
    if (opt.scroll) el.classList.add('scroll');
    draw();
    const selRow = () => { const r = rows[idx]; if (r && r.scrollIntoView && el.scrollHeight > el.clientHeight) r.scrollIntoView({ block: 'nearest' }); };
    const w = {
      kind: 'menu', cancelable: opt.cancel !== undefined,
      update() {
        if (G.auto) {
          const q = opt.battle ? G.autoBattle : G.autoChoices;
          let a = q.length ? q.shift() : (opt.autoDefault ?? 0);
          if (a === 'cancel') return close(opt.cancel ?? -1);
          idx = clamp(a, 0, norm.length - 1); return pick();
        }
        let moved = false;
        if (Input.take('up')) { const n = idx - cols; if (n >= 0 || !opt.noWrap) { idx = (n + norm.length) % norm.length; moved = true; } }
        if (Input.take('down')) { const n = idx + cols; if (n < norm.length || !opt.noWrap) { idx = n % norm.length; moved = true; } }
        if (cols > 1 && Input.take('left')) { idx = (idx - 1 + norm.length) % norm.length; moved = true; }
        if (cols > 1 && Input.take('right')) { idx = (idx + 1) % norm.length; moved = true; }

        if (Input.take('a')) pick();

    };

    function close(v) { UI.remove(w); el.remove(); if (opt.onClose) opt.onClose(v); res(v); }
    UI.push(w);
  });
}

// ---------------------------------------------------------------------
//  主人公の能力・アイテム・特技
// ---------------------------------------------------------------------
function levelStats(lv) {

}

    hp: s.hp, mhp: s.hp, mp: s.mp, mmp: s.mp, atk: s.atk, def: s.def, agi: s.agi };
}
function giveItem(id, n = 1) {

function checkLevelUp(msgs) {
  const h = G.hero; const L = DATA.hero.levels;
  while (h.lv < L.length && h.exp >= L[h.lv].exp) {
    const old = levelStats(h.lv); h.lv++; const s = levelStats(h.lv);
    h.mhp += s.hp - old.hp; h.mmp += s.mp - old.mp; h.hp += s.hp - old.hp; h.mp += s.mp - old.mp;

// ---------------------------------------------------------------------
//  条件（フラグ）
// ---------------------------------------------------------------------
function cond(c) {
  if (c === undefined || c === null) return true;
  if (typeof c === 'function') return !!c(G);
  if (Array.isArray(c)) return c.every(cond);
  if (typeof c === 'string') {
    if (c.startsWith('!')) return !cond(c.slice(1));
    if (c === '@reversed') return G.reversed;
    if (c.startsWith('item:')) return (G.items[c.slice(5)] || 0) > 0;
    return !!G.flags[c];
  }
  if (c.all) return c.all.every(cond);
  if (c.any) return c.any.some(cond);
  if (c.not) return !cond(c.not);
  if (c.item) return (G.items[c.item] || 0) >= (c.count || 1);
  if (c.flag) {
    const v = G.flags[c.flag] ?? 0;
    if ('eq' in c) return v === c.eq; if ('gte' in c) return v >= c.gte; if ('lt' in c) return v < c.lt;
    return !!v;
  }
  if (c.lv) return G.hero.lv >= c.lv;
  return true;
}

// ---------------------------------------------------------------------
//  マップ
// ---------------------------------------------------------------------
function buildMap(id) {
  const def = DATA.maps[id];
  if (!def) throw new Error('未定義のマップ: ' + id);
  const legend = Object.assign({}, DEFAULT_LEGEND, def.legend || {});
  const h = def.tiles.length, w = Math.max(...def.tiles.map(r => r.length));
  const grid = def.tiles.map((row, y) => Array.from({ length: w }, (_, x) => {
    const ch = row[x] ?? ' ';
    const name = legend[ch];
    if (!name) throw new Error(`マップ ${id} の (${x},${y}) の文字「${ch}」が凡例にない`);
    return tileInfo(name);
  }));
  const m = { id, def, w, h, grid, outside: tileInfo(def.outside || 'void'), npcs: [] };
  for (const nd of def.npcs || []) m.npcs.push(makeEntity(nd));
  return m;
}
function makeEntity(nd) {
  return { def: nd, id: nd.id, x: nd.x, y: nd.y, fx: nd.x, fy: nd.y, prog: 1, moving: false, dir: nd.dir || 'down',
    sprite: nd.sprite || 'villager', path: null, timer: rnd(0.5, 2.5), anim: 0, speed: nd.speed || 3, moveDir: 'down' };
}
function tileAt(x, y) { const m = G.map; if (x < 0 || y < 0 || x >= m.w || y >= m.h) return null; return m.grid[y][x]; }
function npcVisible(n) { return cond(n.def.if) && !(n.def.unless && cond(n.def.unless)) && !G.flags['_hide_' + n.id]; }
function entityAt(x, y, except) {
  for (const n of G.map.npcs) if (n !== except && npcVisible(n) && !n.def.ghost && n.x === x && n.y === y) return n;
  if (G.hero && except !== G.hero && G.hero.x === x && G.hero.y === y) return G.hero;
  return null;
}
function blocked(x, y, ent) {
  const t = tileAt(x, y);
  if (!t || t.solid) return true;
  if (entityAt(x, y, ent)) return true;
  if (ent !== G.hero) { // NPC は扉・ワープ・指定範囲の外へ出ない
    const md = G.map.def;
    if (!(ent.path && ent.path.length) && (md.warps || []).some(wp => wp.x === x && wp.y === y)) return true;
    const a = ent.def && !(ent.path && ent.path.length) && ent.def.area;
    if (a && (x < a[0] || y < a[1] || x > a[2] || y > a[3])) return true;
  }
  return false;
}
function startMove(ent, dir) {
  const [dx, dy] = DIRS[dir];
  ent.dir = dir; ent.moveDir = dir;
  const nx = ent.x + dx, ny = ent.y + dy;
  if (blocked(nx, ny, ent)) return false;
  ent.fx = ent.x; ent.fy = ent.y; ent.x = nx; ent.y = ny; ent.prog = 0; ent.moving = true;
  return true;
}
function updateEntity(ent, dt) {
  if (!ent.moving) return false;
  ent.prog += dt * ent.speed; ent.anim += dt * ent.speed;
  if (ent.prog >= 1) { ent.prog = 1; ent.moving = false; return true; }
  return false;
}
function entPos(ent) {
  const p = ent.prog;
  return { x: (ent.fx + (ent.x - ent.fx) * p) * TILE, y: (ent.fy + (ent.y - ent.fy) * p) * TILE };
}

async function warpTo(mapId, x, y, dir, opt = {}) {
  const fade = opt.fade !== false && !G.auto;
  if (fade) await fadeTo(1, 0.18);
  G.map = buildMap(mapId);
  const h = G.hero; h.x = h.fx = x; h.y = h.fy = y; h.prog = 1; h.moving = false; if (dir) h.dir = dir;
  G.cam.override = null;
  G.stepCount = 0;
  if (!G.reversed || !DATA.maps[mapId].keepBgmWhenReversed) Sound.bgm(G.map.def.bgm);
  updateCamera(true);
  autosave();
  if (fade) await fadeTo(0, 0.18);
  // 押しっぱなしの向きは ワープで いったん切る（塔の階段 (1,6)⇔(1,10) を行き来し続ける ループの防止）。もう一度 押せば 歩ける
  Input.dirStack = []; Input.tapDir = null;
  if (G.map.def.onEnter) await runScript(G.map.def.onEnter, {});
}

function updateNPCs(dt) {
  for (const n of G.map.npcs) {
    if (!npcVisible(n)) continue;
    if (updateEntity(n, dt) && n.path && n.path.length) continue;
    if (n.moving) continue;
    if (n.path && n.path.length) { // スクリプトによる移動
      const d = n.path[0];
      if (d === 'W') { n.waitT = 0.25; n.path[0] = 'w'; continue; }
      if (d === 'w') { n.waitT -= dt; if (n.waitT <= 0) n.path.shift(); continue; }
      if (!startMove(n, d)) { // ふさがっていたら少し待ち、それでもだめなら飛ばす
        n.stuckT = (n.stuckT || 0) + dt;
        if (n.stuckT >= 1.5) { n.path.shift(); n.stuckT = 0; }
      } else { n.path.shift(); n.stuckT = 0; }
      if (n.backward) n.dir = OPPOSITE[n.moveDir];
      continue;
    }
    n.path = null;
    if (G.scriptDepth > 0 || UI.busy()) continue;
    const mv = n.def.move || 'still';
    if (mv === 'wander' || (mv === 'still' && false)) {
      n.timer -= dt;
      if (n.timer <= 0) {
        n.timer = rnd(1.0, 2.6);
        const d = ['up', 'down', 'left', 'right'][rint(0, 3)];
        startMove(n, d);
        if (G.reversed) n.dir = OPPOSITE[n.moveDir]; // 逆行の世界では後ろ向きに歩く
      }
    } else if (typeof mv === 'string' && mv.startsWith('pace:')) { // 例 'pace:RRRLLL'
      n.timer -= dt;
      if (n.timer <= 0) {
        n.timer = 0.4; const seq = mv.slice(5); n.paceI = (n.paceI || 0);
        const d = PATH_CH[seq[n.paceI % seq.length]];
        if (startMove(n, d)) n.paceI++;
        if (G.reversed) n.dir = OPPOSITE[n.moveDir];
      }
    }
  }
}

// ---------------------------------------------------------------------
//  主人公の操作
// ---------------------------------------------------------------------
function heroControllable() { return G.mode === 'map' && G.scriptDepth === 0 && !UI.busy() && !G.picture; }
function updateHero(dt) {
  const h = G.hero;
  const arrived = updateEntity(h, dt);
  if (arrived) { if (G.scriptDepth === 0) onHeroArrive(); return; }
  if (h.moving) { if (Input.take('b')) G.wantMenu = true; return; } // 歩いている 最中の B は 一歩 おわってから メニューを ひらく
  if (!heroControllable()) { Input.tapDir = null; G.wantMenu = false; return; }
  if (Input.take('a')) { G.wantMenu = false; interact(); return; }
  if (Input.take('b') || G.wantMenu) { G.wantMenu = false; fieldMenu(); return; }
  const d = Input.dir();
  Input.tapDir = null;
  if (d) {
    const [dx, dy] = DIRS[d];
    const nx = h.x + dx, ny = h.y + dy;
    const m = G.map;
    const ew = m.def.edgeWarp && (m.def.edgeWarp.to ? m.def.edgeWarp : m.def.edgeWarp[d]);
    if ((nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) && ew && cond(ew.if)) {
      h.dir = d; Sound.sfx(ew.sound || 'stairs'); runScript([{ warp: ew.to, x: ew.x, y: ew.y, dir: ew.dir || d }], {}); return;
    }
    if (!startMove(h, d)) {
      if (G.clock - G.lastBump > 0.3) { Sound.sfx('bump'); G.lastBump = G.clock; }
    }
  }
}
function onHeroArrive() {
  const h = G.hero, md = G.map.def;
  const wp = (md.warps || []).find(w => w.x === h.x && w.y === h.y && cond(w.if));
  if (wp) {
    const snd = wp.sound || h.lastTileSound || (tileAt(h.x, h.y).sound) || 'door';
    Sound.sfx(snd);
    runScript([{ warp: wp.to, x: wp.tx, y: wp.ty, dir: wp.dir || h.dir }], {});
    return;
  }
  const tr = (md.triggers || []).find(t => t.x === h.x && t.y === h.y && cond(t.if) && !(t.once && G.flags['_once_' + G.map.id + '_' + t.x + '_' + t.y]));
  if (tr) {
    if (tr.once) G.flags['_once_' + G.map.id + '_' + tr.x + '_' + tr.y] = true;
    runScript(tr.script, {});
    return;
  }
  // ランダムエンカウント
  const enc = md.encounter;
  if (enc && !G.noEncounter && !G.flags._noEncounter) {
    G.stepCount++;
    const safe = enc.safeTiles || ['path', 'bridge', 'cobble', 'door', 'stairsup', 'stairsdown', 'cave'];
    if (G.stepCount > (enc.minSteps ?? 4) && !safe.includes(tileAt(h.x, h.y).name) && Math.random() < (enc.rate || 0.08)) {
      G.stepCount = 0;
      const group = enc.groups[rint(0, enc.groups.length - 1)];
      runScript([{ battle: group, bg: md.battleBg }], {});
    }
  }
}
function interact() {
  const h = G.hero, [dx, dy] = DIRS[h.dir];
  let tx = h.x + dx, ty = h.y + dy;
  const t = tileAt(tx, ty);
  let n = entityAt(tx, ty, h);
  if (!n && t && t.counter) { tx += dx; ty += dy; n = entityAt(tx, ty, h); } // カウンター越しに話す
  if (n && n !== h) {
    if (!n.def.fixedDir && !charFrames(n.sprite).object) n.dir = OPPOSITE[h.dir];
    const script = npcScript(n.def);
    if (script) runScript(script, { name: n.def.name, npc: n });
    return;
  }
  const md = G.map.def;
  for (const [ox, oy] of [[tx, ty], [h.x, h.y]]) {
    const ob = (md.objects || []).find(o => o.x === ox && o.y === oy && cond(o.if));
    if (ob) { runScript(ob.script || [{ say: ob.say }], { name: ob.name }); return; }
  }
}
function npcScript(nd) {
  if (nd.variants) for (const v of nd.variants) if (cond(v.if)) return v.script || [{ say: v.say, mirror: v.mirror }];
  if (nd.script) return nd.script;
  if (nd.say) return [{ say: nd.say, mirror: nd.mirror }];
  return null;
}

// ---------------------------------------------------------------------
//  演出
// ---------------------------------------------------------------------
function fadeTo(a, time = 0.4, color) {

  G.fade.target = a; G.fade.speed = 1 / Math.max(0.01, time);
  return until(() => G.fade.a === G.fade.target);
}
function updateFx(dt) {
  const f = G.fade;
  if (f.a < f.target) f.a = Math.min(f.target, f.a + dt * f.speed);
  else if (f.a > f.target) f.a = Math.max(f.target, f.a - dt * f.speed);
  if (G.shake.t > 0) G.shake.t -= dt;
  if (G.rewindFx > 0) G.rewindFx = Math.max(0, G.rewindFx - dt);
  if (G.battle && G.battle.hitT > 0) G.battle.hitT -= dt;
}
function updateCamera(snap) {
  const h = G.hero; if (!h || !G.map) return;
  let tx, ty;
  if (G.cam.override) { tx = G.cam.override.x * TILE + 8; ty = G.cam.override.y * TILE + 8; }
  else { const p = entPos(h); tx = p.x + 8; ty = p.y + 8; }
  tx -= VW / 2; ty -= VH / 2;
  if (G.map.def.clampCamera) {
    tx = G.map.w * TILE <= VW ? (G.map.w * TILE - VW) / 2 : clamp(tx, 0, G.map.w * TILE - VW);
    ty = G.map.h * TILE <= VH ? (G.map.h * TILE - VH) / 2 : clamp(ty, 0, G.map.h * TILE - VH);
  }
  if (snap || !G.cam.override) { G.cam.x = tx; G.cam.y = ty; }
  else { const k = Math.min(1, G.cam.pan * (1 / 60)); G.cam.x += (tx - G.cam.x) * k * 4; G.cam.y += (ty - G.cam.y) * k * 4; }
}
// さかさ（画面全体を色反転）のあいだも「黒いところ」は黒く見せるための色。
// 画面に invert をかけるので、黒にしたい所は白で描く（ふち・暗転・空白）。
function scrCol(col) {
  if (!G.reversed || typeof col !== 'string') return col;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(col); if (!m) return col;
  let h = m[1]; if (h.length === 3) h = h.split('').map(x => x + x).join('');
  return '#' + (0xffffff ^ parseInt(h, 16)).toString(16).padStart(6, '0');
}
// 描いた範囲の色を反転（画面の invert と打ち消しあって、元の色で見える）
function unInvert(c, x, y, w, h) {
  c.save(); c.globalAlpha = 1; c.globalCompositeOperation = 'difference'; c.fillStyle = '#fff'; c.fillRect(x, y, w, h); c.restore();
}
function setReversed(on) {
  G.reversed = on;

  for (const n of (G.map ? G.map.npcs : [])) if (n.moving) n.dir = on ? OPPOSITE[n.moveDir] : n.moveDir;

// ---------------------------------------------------------------------
const OPS = {};
const OP_ORDER = ['showPicture', 'choice', 'say', 'setFlag', 'addFlag', 'if', 'warp', 'moveNPC', 'face', 'wait', 'fade', 'shake',
  'hidePicture', 'battle', 'heal', 'giveItem', 'takeItem', 'gold', 'learn', 'playSound', 'bgm',
  'reverse', 'camera', 'call', 'save', 'gameClear', 'end', 'setNPC', 'js'];
async function runScript(script, ctx = {}) {
  if (typeof script === 'string') {
    const s = DATA.scripts[script];
    if (!s) throw new Error('未定義のスクリプト: ' + script);
    script = s;
  }
  G.scriptDepth++;
  try { await runCmds(script, ctx); }
  catch (e) { console.error('スクリプトの誤り', e); if (TEST) throw e; }
  finally {
    G.scriptDepth--; closeMessage();
    // 場面が終わったら「場面のはじめから やりなおす」印を消して保存
    if (G.scriptDepth === 0 && G.pendingResume) { const r = G.pendingResume; G.pendingResume = null; setTimeout(() => runScript(r, {}), 0); }
    else if (G.scriptDepth === 0 && G.mode === 'map') { if (G.flags) delete G.flags._resume; autosave(); }
  }
}
async function runCmds(list, ctx) {
  for (const cmd of list) {
    const op = OP_ORDER.find(k => k in cmd);
    if (!op) throw new Error('不明な命令: ' + JSON.stringify(cmd));
    const r = await OPS[op](cmd, ctx);
    if (r === 'end' || G.mode === 'title') return 'end';
  }
}
function mirrorText(p) { return Array.isArray(p) ? p.map(mirrorText).reverse() : Array.from(p).reverse().join(''); }
async function sayPages(pages, name, keepLast) {
  pages = Array.isArray(pages) ? pages : [pages];

}

OPS.choice = async (c, ctx) => {

};

function findEnt(id, ctx) {
  if (id === 'hero') return G.hero;
  if (id === 'this') return ctx.npc;

OPS.moveNPC = async (c, ctx) => {
  const e = findEnt(c.moveNPC, ctx);
  e.path = Array.from(c.path).map(ch => PATH_CH[ch] || ch);
  e.backward = !!(c.backward ?? (G.reversed && c.moveNPC !== 'hero'));
  if (c.speed) e.speed = c.speed;
  if (e === G.hero) { // 主人公も同じ仕組みで動かす
    const entered = e.moveDir; // 押し戻しの先が ふさがっていたら、入ってきた 向きの 反対へ もどす
    const runner = async () => {
      let first = true;
      while (e.path.length) {
        let d = e.path.shift();
        if (d === 'W' || d === 'w') { await sleep(0.25); continue; }
        if (!startMove(e, d) && !(first && e.backward && entered && entered !== OPPOSITE[d] && startMove(e, d = OPPOSITE[entered]))) { first = false; await sleep(0.1); continue; }
        first = false;
        if (e.backward) e.dir = OPPOSITE[d];
        await until(() => !e.moving);
      }
      // 押し戻しの あとは 押しっぱなしの 向きを 切る（同じ きっかけに また入り続けない。warpTo と同じ）
      if (e.backward) { Input.dirStack = []; Input.tapDir = null; }
      e.backward = false;
    };
    if (c.wait === false) runner(); else await runner();
    return;
  }
  if (c.wait !== false) await until(() => !e.path || (!e.path.length && !e.moving));
  if (c.wait !== false) e.backward = false;
};

OPS.battle = async (c, ctx) => {

};

// 全滅：えらべる「もういちど たたかう／さいごの きろくから」。どちらも失うものはない。
// GAME_DATA.gameOver = { retry: false } で昔ながらの「おかね半分で respawn へ」だけにできる。
// ---- スタッフロール（GAME_DATA.credits または gameClear の credits。A 押しっぱなしで速く） ----
async function rollCredits(lines) {
  const el = $('#roll');
  el.innerHTML = ''; const inner = document.createElement('div'); el.appendChild(inner);
  for (const ln of lines) {
    const d = document.createElement('div');
    if (typeof ln === 'string') { d.textContent = ln; if (!ln) d.className = 'gap'; }
    else { d.textContent = ln.text || ''; d.className = ln.head ? 'head' : ''; }
    inner.appendChild(d);
  }
  el.hidden = false; G.tapWait = false;
  await sleep(0.05);
  const H = el.clientHeight, total = inner.offsetHeight + H;
  let y = 0;
  await until(() => {
    y += (Input.held.a || Input.held.b ? 6 : 1) * (DATA.creditsSpeed || 0.55);
    inner.style.transform = `translateY(${Math.round(H - y)}px)`;
    return y >= total;
  });
  el.hidden = true; el.innerHTML = '';
}
// ---- エンディングの記録（周回をまたいで残す。タイトルの「エンディング」で一覧） ----
function seenEndings() { try { return JSON.parse(localStorage.getItem(ENDINGS_KEY) || '[]'); } catch (e) { return []; } }
function recordEnding(id) {
  const s = seenEndings(); if (s.includes(id)) return;
  s.push(id); try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(s)); } catch (e) { /* 無視 */ }
}

async function gameOver(pre, c = {}) {
  const go = DATA.gameOver || {};
  Sound.bgm(null); Sound.sfx('lose');
  await fadeTo(1, 0.8, '#300');
  const save = readSave();
  const choices = [], acts = [];
  if (go.retry !== false && c.retry !== false) { choices.push(go.retryText || 'もういちど たたかう'); acts.push('retry'); }
  if (save && go.load !== false) { choices.push(go.loadText || 'さいごの きろくから'); acts.push('load'); }
  if (choices.length && !G.auto) {
    const big = $('#bigText'); big.textContent = go.title || '― ちからつきた ―'; big.hidden = false;
    G.fade.a = 0.82;
    const i = await menu(choices, { cls: 'titlemenu' });
    big.hidden = true;
    const act = acts[i];
    if (act === 'retry') { await fadeTo(1, 0.2); G.fade.color = '#000'; return 'retry'; }
    if (act === 'load') {
      G.fade.color = '#000'; G.fade.a = 1;
      applySave(readSave()); G.mode = 'map'; Sound.bgm(G.map.def.bgm); updateCamera(true);
      G.pendingResume = G.flags._resume || null; // 台本が終わったら、その場面を はじめから
      await fadeTo(0, 0.5);
      return 'load';
    }
  }
  // 昔ながら：おかね半分で respawn の場所へ
  const r = DATA.start.respawn || DATA.start;
  G.hero.hp = G.hero.mhp; G.hero.mp = G.hero.mmp; G.hero.gold = Math.floor(G.hero.gold / 2);
  setReversed(false);
  G.fade.color = '#000';
  await warpTo(r.map, r.x, r.y, 'down', { fade: false });
  await fadeTo(0, 0.6);
  await message(DATA.gameOverText || '……めが さめると しっている ばしょに いた。\nおかねが はんぶんに なっている。', { name: '' });
  return 'respawn';
}

function makeEnemy(id, idx, all) {
  const d = DATA.enemies[id];
  if (!d) throw new Error('未定義の敵: ' + id);
  const same = all.filter(x => x === id).length > 1;
  const letter = same ? 'ABC'[all.slice(0, idx + 1).filter(x => x === id).length - 1] : '';
  return Object.assign({ id, name: d.name + letter, hp: d.hp, mhp: d.hp, mp: d.mp || 0, atk: d.atk, def: d.def, agi: d.agi || 5,
    exp: d.exp || 0, gold: d.gold || 0, def0: d, charge: 0, alive: true, alpha: 1, hitT: 0 });
}
function calcDamage(atk, def, mul = 1) {
  const base = (atk - def / 2) / 2;
  let dmg = base <= 0 ? rint(0, 1) : Math.round(base * rnd(0.85, 1.15));
  return Math.max(0, Math.round(dmg * mul));
}
async function blog(text, snd) { if (snd) Sound.sfx(snd); await message(text, { keep: true, autoClose: DATA.battleMsgTime ?? 0.7, speed: 70 }); }
function heroHit(dmg) {
  const h = G.hero; h.hp = Math.max(0, h.hp - dmg);
  G.battle.hurtT = 0.35;
  heroPopup(dmg > 0 ? '-' + dmg : '0', 'hurt');
  if (!reducedMotion()) { G.shake.t = 0.3; G.shake.power = 3; }

}
function updateBattleStatus() {
  const b = G.battle; if (!b) return;
  const h = G.hero;

  b.statusEl.classList.toggle('danger', h.hp <= h.mhp / 4);

// MP を使うゲームか（レベル表に MP が1つもなく、特技も MP 0 なら MP の行を出さない）
function usesMP() {
  return (DATA.hero.levels || []).some(l => l.mp > 0) || Object.values(DATA.skills || {}).some(k => k.mp > 0) || Object.values(DATA.items || {}).some(i => i.kind === 'mp');
}
// HP/MP の窓の中身（数字＋ゲージ。ゲージで「あとどれくらい」が一目で分かる）
function statusHtml(h, full) {
  const bar = (v, m, c) => `<i class="bar ${c}"><i style="width:${m ? Math.round(clamp(v / m, 0, 1) * 100) : 0}%"></i></i>`;
  return `<div class="title">${h.name}</div>`
    + `<div>HP <b>${full ? h.hp + '/' + h.mhp : h.hp}</b></div>${bar(h.hp, h.mhp, 'hp')}`
    + (usesMP() ? `<div>MP <b>${full ? h.mp + '/' + h.mmp : h.mp}</b></div>${bar(h.mp, h.mmp, 'mp')}` : '')
    + `<div>Lv <b>${h.lv}</b></div>` + (full ? `<div>G <b>${h.gold}</b></div>` : '');
}
// 戦闘：右下の「敵の名前」窓（DQ 風。同じ敵はまとめて数を出す）
function updateEnemyWin(b) {
  if (!b.enemyEl) return;
  const groups = [];
  for (const e of b.enemies) if (e.alive) {
    const n = DATA.enemies[e.id].name, g = groups.find(x => x.n === n);
    if (g) g.c++; else groups.push({ n, c: 1 });
  }
  b.enemyEl.innerHTML = groups.map(g => `<div class="item"><span class="t"></span><span class="sub">${g.c > 1 ? '×' + g.c : ''}</span></div>`).join('');
  b.enemyEl.querySelectorAll('.t').forEach((el, i) => { el.textContent = groups[i].n; });
}
function heroPopup(text, cls) {
  const b = G.battle; if (!b || !b.statusEl) return;
  popup(text, b.statusEl.offsetLeft + b.statusEl.offsetWidth + 6, b.statusEl.offsetTop + 30, cls);
}
async function runBattle(ids, opt = {}) {
  const prevMode = G.mode, prevBgm = Sound.bgmId;
  G.stats.battles++;
  const h = G.hero;
  Sound.sfx('encounter');
  if (!G.auto && !reducedMotion() && G.mode === 'map' && G.fade.a < 0.5) { // 出会いがしらの白い点滅
    for (let i = 0; i < 2; i++) { await fadeTo(0.85, 0.05, '#fff'); await fadeTo(0, 0.05); }
  }
  if (!G.auto) await fadeTo(1, 0.25, '#000');
  const b = G.battle = { enemies: ids.map((id, i, a) => makeEnemy(id, i, a)), turn: 0, history: [], allies: [], skip: 0,
    bg: opt.bg || (G.map && G.map.def.battleBg) || 'field', canRun: opt.canRun ?? !opt.boss, hitT: 0, hurtT: 0 };
  b.statusEl = infoWin('status', ''); updateBattleStatus();
  b.enemyEl = infoWin('enemies', ''); b.enemyEl.hidden = true; updateEnemyWin(b);
  G.mode = 'battle';
  Sound.bgm(opt.bgm || (opt.boss ? 'boss' : DATA.battleBgm || 'battle'));
  if (!G.auto) await fadeTo(0, 0.25);
  const alive = () => b.enemies.filter(e => e.alive);
  const names = [...new Set(b.enemies.map(e => DATA.enemies[e.id].name))];
  await blog(opt.intro || (b.enemies.length > 1 ? `${names.join('と ')}たちが あらわれた！` : `${b.enemies[0].name}が あらわれた！`));
  await battleTutorial(opt);
  let result = null;
  while (!result) {
    b.turn++;
    // ---- 主人公のコマンド ----
    const act = await battleCommand(b);
    b.history.push({ heroHp: h.hp, charges: b.enemies.map(e => e.charge) });
    const order = [{ hero: true, agi: h.agi * rnd(0.6, 1.2) }].concat(alive().map(e => ({ e, agi: e.agi * rnd(0.6, 1.2) })));
    order.sort((a, c) => c.agi - a.agi);
    if (act.type === 'skill' && DATA.skills[act.id].first) order.sort((a, c) => (c.hero ? 1 : 0) - (a.hero ? 1 : 0));
    if (act.type === 'run') order.sort((a, c) => (c.hero ? 1 : 0) - (a.hero ? 1 : 0));
    for (const o of order) {
      if (result) break;
      if (o.hero) {
        result = await heroAction(b, act);
        if (!result) for (const al of b.allies) if (al.turns > 0 && alive().length) await allyAction(b, al);
      } else if (o.e.alive) {
        if (b.skip > 0) continue;
        await enemyAction(b, o.e);
        if (h.hp <= 0) result = 'lose';
      }
      if (!result && !alive().length) result = 'win';
    }
    if (b.skip > 0) b.skip--;
    b.allies.forEach(a => a.turns--);
    for (const a of b.allies.filter(a => a.turns === 0)) await blog(a.leaveText || `${a.name}は すがたを けした。`);
    b.allies = b.allies.filter(a => a.turns > 0);
  }
  // ---- 結果 ----
  if (result === 'win') {
    const exp = b.enemies.reduce((s, e) => s + e.exp, 0), gold = b.enemies.reduce((s, e) => s + e.gold, 0);
    Sound.bgm(null); Sound.sfx('win');
    await blog(`${names.join('と ')}を やっつけた！`);
    h.exp += exp; h.gold += gold;
    await blog(`けいけんち ${exp}ポイント かくとく。${gold ? gold + 'ゴールドを てにいれた。' : ''}`);
    const msgs = []; checkLevelUp(msgs);
    for (const m of msgs) { updateBattleStatus(); await blog(m.t, m.snd); }
    for (const e of b.enemies) {
      const dr = e.def0.drop; if (dr && Math.random() < (dr.rate ?? 1)) { giveItem(dr.item); await blog(`${e.name}は ${DATA.items[dr.item].name}を おとした！`, 'item'); }
    }
  } else if (result === 'lose') {
    await blog(`${h.name}は ちからつきた……`, 'lose');
  }
  closeMessage();
  b.statusEl.remove(); b.enemyEl.remove();
  document.querySelectorAll('.pop').forEach(e => e.remove());
  if (!G.auto) await fadeTo(1, 0.25);
  G.battle = null; G.mode = prevMode === 'battle' ? 'map' : prevMode;
  Sound.bgm(prevBgm);
  if (!G.auto) await fadeTo(0, 0.25);
  if (result !== 'lose') autosave();
  return result;
}
async function battleCommand(b) {
  const h = G.hero;
  closeMessage();
  for (; ;) {
    updateEnemyWin(b); b.enemyEl.hidden = false;
    const first = !G.flags._tutCmd && DATA.battleTutorial !== false;
    const c = await menu(['たたかう', 'とくぎ', 'どうぐ', 'にげる'], { cls: 'command', cols: 2, battle: true, autoDefault: 0, title: h.name, hint: first ? 0 : undefined });
    b.enemyEl.hidden = true;
    if (c === 0) G.flags._tutCmd = true;
    if (c === 0) { const t = await pickTarget(b); if (t) return { type: 'attack', target: t }; continue; }
    if (c === 1) {
      if (!G.skills.length) { await blog('まだ とくぎを おぼえていない。'); closeMessage(); continue; }
      const list = G.skills.map(id => ({ text: DATA.skills[id].name, sub: DATA.skills[id].mp ? DATA.skills[id].mp + 'MP' : '', disabled: DATA.skills[id].mp > h.mp || DATA.skills[id].field }));
      const i = await menu(list, { cls: 'sub', cancel: -1, battle: true, title: 'とくぎ' });
      if (i < 0) continue;
      const sk = DATA.skills[G.skills[i]];
      let target = null;
      if (sk.target === 'enemy') { target = await pickTarget(b); if (!target) continue; }
      return { type: 'skill', id: G.skills[i], target };
    }
    if (c === 2) {
      const ids = Object.keys(G.items).filter(id => DATA.items[id].battle);
      if (!ids.length) { await blog('つかえる どうぐを もっていない。'); closeMessage(); continue; }
      const i = await menu(ids.map(id => ({ text: DATA.items[id].name, sub: '×' + G.items[id] })), { cls: 'sub', cancel: -1, battle: true, title: 'どうぐ' });
      if (i < 0) continue;
      return { type: 'item', id: ids[i] };
    }
    if (c === 3) return { type: 'run' };
  }
}
async function pickTarget(b) {
  const al = b.enemies.filter(e => e.alive);
  if (al.length === 1) return al[0];
  const i = await menu(al.map(e => e.name), { cls: 'sub', cancel: -1, battle: true, title: 'どれを？',
    onMove: k => { b.target = al[k]; }, onClose: () => { b.target = null; } });
  return i < 0 ? null : al[i];
}
async function damageEnemy(b, e, dmg, snd = 'hit') {
  if (dmg <= 0) {
    if (e._cx !== undefined) { const p = canvasToStage(e._cx, e._top); popup('ミス', p.x, p.y, 'miss'); }
    await blog(`ミス！ ${e.name}に ダメージを あたえられない！`, 'miss'); return;
  }
  e.hp = Math.max(0, e.hp - dmg); e.hitT = 0.3;
  if (e._cx !== undefined) { const p = canvasToStage(e._cx, e._top); popup(String(dmg), p.x, p.y, 'dmg'); }
  await blog(`${e.name}に ${dmg}の ダメージ！`, snd);
  if (e.hp <= 0) { e.alive = false; await blog(e.def0.defeatText || `${e.name}を たおした！`); }
}
async function heroAction(b, act) {
  const h = G.hero;
  if (act.type === 'attack') {
    let e = act.target.alive ? act.target : b.enemies.find(x => x.alive);
    await blog(`${h.name}の こうげき！`);
    const crit = Math.random() < 1 / 24;
    if (crit) await blog('かいしんの いちげき！', 'magic');
    await damageEnemy(b, e, crit ? Math.round(h.atk * rnd(0.95, 1.05)) : calcDamage(h.atk, e.def));
  } else if (act.type === 'skill') {
    const sk = DATA.skills[act.id];
    h.mp -= sk.mp; updateBattleStatus();
    await blog(sk.useText ? fmt(sk.useText) : `${h.name}は ${sk.name}を つかった！`, 'magic');
    const fn = SKILL_KINDS[sk.kind];
    if (!fn) throw new Error('未定義の特技の種類: ' + sk.kind);
    await fn(b, sk, act.target);
  } else if (act.type === 'item') {
    const it = DATA.items[act.id];
    giveItem(act.id, -1);
    await blog(`${h.name}は ${it.name}を つかった！`);
    await useItemEffect(it);
  } else if (act.type === 'run') {
    await blog(`${h.name}は にげだした！`, 'run');
    const fast = b.enemies.filter(e => e.alive).reduce((m, e) => Math.max(m, e.agi), 0);
    if (b.canRun && Math.random() < clamp(0.5 + (h.agi - fast) * 0.05, 0.25, 0.9)) return 'run';
    await blog(b.canRun ? 'しかし まわりこまれて しまった！' : 'しかし にげられない！');
  }
  updateBattleStatus();
  return null;
}
async function useItemEffect(it) {
  const h = G.hero;
  if (it.kind === 'heal') {
    const v = Math.min(h.mhp - h.hp, Math.round(it.power * rnd(0.9, 1.1)));
    h.hp += v; Sound.sfx('heal'); updateBattleStatus(); heroPopup('+' + v, 'heal');
    await (G.battle ? blog : message)(`${h.name}の HPが ${v} かいふくした！`);
  } else if (it.kind === 'mp') {
    const v = Math.min(h.mmp - h.mp, it.power); h.mp += v; Sound.sfx('heal'); updateBattleStatus();
    await (G.battle ? blog : message)(`${h.name}の MPが ${v} かいふくした！`);
  } else await (G.battle ? blog : message)(it.useText || 'しかし なにも おこらなかった。');
}
async function allyAction(b, al) {
  const e = b.enemies.filter(x => x.alive)[0];
  await blog(`${al.name}の こうげき！`); G.stats.allyHits++;
  await damageEnemy(b, e, calcDamage(G.hero.atk * (al.power || 1), e.def));
}
async function enemyAction(b, e) {
  const d = e.def0;
  if (e.charge > 0) { // ためた力を放つ
    e.charge = 0;
    const ca = d.chargeAttack || {};
    await blog(fmt(ca.text || `${e.name}の ちからを こめた いちげき！`));
    const dmg = calcDamage(e.atk, G.hero.def, ca.mul || 2.5);
    heroHit(dmg); Sound.sfx('hurt');
    await blog(`${G.hero.name}は ${dmg}の ダメージを うけた！`);
    return;
  }
  const acts = d.actions || [{ type: 'attack', w: 1 }];
  const tot = acts.reduce((s, a) => s + (a.w || 1), 0);
  let r = Math.random() * tot, a = acts[0];
  for (const x of acts) { r -= (x.w || 1); if (r <= 0) { a = x; break; } }
  if (a.type === 'attack') {
    await blog(`${e.name}の こうげき！`);
    if (Math.random() < (d.missRate ?? 0.06)) { await blog(`${G.hero.name}は ひらりと みをかわした！`, 'miss'); return; }
    const dmg = calcDamage(e.atk, G.hero.def, a.mul || 1);
    heroHit(dmg); Sound.sfx('hurt');
    await blog(`${G.hero.name}は ${dmg}の ダメージを うけた！`);
  } else if (a.type === 'charge') {
    e.charge = 1;
    await blog(fmt(a.text || `${e.name}は ちからを ためている……`), 'magic');
  } else if (a.type === 'spell') {
    await blog(fmt(a.text || `${e.name}は じゅもんを となえた！`), 'magic');
    const dmg = Math.max(1, Math.round(rnd(a.min || 4, a.max || 8)));
    heroHit(dmg); Sound.sfx('hurt');
    await blog(`${G.hero.name}は ${dmg}の ダメージを うけた！`);
  } else if (a.type === 'heal') {
    const v = Math.min(e.mhp - e.hp, a.power || 10); e.hp += v;
    await blog(`${e.name}の きずが ふさがっていく！`, 'heal');
  } else if (a.type === 'say') {
    await blog(fmt(a.text));
  }
}

// ---- 特技の種類（GAME_DATA.skills の kind で選ぶ）。js で関数を足せる ----
const SKILL_KINDS = {
  async damage(b, sk, target) {
    const list = sk.target === 'all' ? b.enemies.filter(e => e.alive) : [target];
    for (const e of list) if (e.alive) await damageEnemy(b, e, Math.round(rnd(sk.power[0], sk.power[1])), 'magic');
  },
  async heal(b, sk) {
    const h = G.hero, v = Math.min(h.mhp - h.hp, Math.round(rnd(sk.power[0], sk.power[1])));
    h.hp += v; Sound.sfx('heal'); updateBattleStatus(); heroPopup('+' + v, 'heal');
    await blog(`${h.name}の HPが ${v} かいふくした！`);
  },
  // 時の特技：敵の前のターンをなかったことにする（受けたダメージとためた力が戻り、敵はこのターン動けない）
  async rewind(b, sk) {
    const snap = b.history[b.history.length - 2];
    G.rewindFx = reducedMotion() ? 0 : 0.9; G.rewindDir = -1; Sound.sfx('reverse');
    if (!snap) { await blog(sk.failText || 'しかし もどす じかんが まだ ない！'); return; }
    const h = G.hero;
    const before = h.hp;
    h.hp = Math.max(h.hp, Math.min(h.mhp, snap.heroHp));
    b.enemies.forEach((e, i) => { e.charge = snap.charges[i] || 0; });
    b.skip = sk.skipTurns ?? 1; G.stats.rewinds++;
    updateBattleStatus();
    await blog(fmt(sk.effectText || 'じかんが まきもどった！ てきの さっきの こうどうは なかったことに なった！'));
    if (h.hp > before) await blog(`${h.name}の HPが ${h.hp - before} もどった！`);
  },
  // 時の特技：未来の自分が助けに来る（数ターン一緒に攻撃する）
  async ally(b, sk) {
    if (b.allies.some(a => a.id === sk.id)) { await blog('しかし すでに きている！'); return; }
    b.allies.push({ id: sk.id, name: fmt(sk.allyName || 'みらいの じぶん'), turns: sk.turns || 3, power: sk.power || 1, leaveText: sk.leaveText });
    await blog(fmt(sk.effectText || 'みらいの じぶんが かけつけた！'));
  },
  // 時の特技：敵の時間を遅らせる（数ターン行動不能）
  async slow(b, sk) { b.skip = Math.max(b.skip, sk.turns || 1); await blog(fmt(sk.effectText || 'てきの じかんが ゆっくりに なった！')); },
  async custom(b, sk, target) { await sk.run({ G, battle: b, target, blog, damageEnemy: (e, d) => damageEnemy(b, e, d), heroHit, updateBattleStatus }); },
};

// 「これまでの はなし」：GAME_DATA.storyLog() の 段（{card, text}）を 遊んだ順に。上下で スクロール、A/B（X）で とじる
function storyLogHtml(entries) {
  const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  let html = '<div class="lt">これまでの はなし</div>';
  for (const e of entries) {
    if (e.card) html += `<h3 class="${e.card.startsWith('◀') ? 'back' : ''}">${esc(e.card)}</h3>`;
    html += `<p>${esc(fmt(e.text))}</p>`;
  }
  return html + '<div class="lf">上下：よむ　B：とじる</div>';
}
function storyLogWin() {
  return new Promise(res => {
    const entries = DATA.storyLog ? DATA.storyLog() : [];
    const el = infoWin('storylog scroll', storyLogHtml(entries));
    Sound.sfx('select');
    const step = () => Math.max(32, Math.round(el.clientHeight * 0.4));
    const w = {
      kind: 'log', cancelable: true, labels: ['とじる', 'とじる'], el,
      update() {
        if (G.auto) return close();
        if (Input.take('down')) el.scrollTop += step();
        if (Input.take('up')) el.scrollTop -= step();
        if (Input.take('right')) el.scrollTop += el.clientHeight;
        if (Input.take('left')) el.scrollTop -= el.clientHeight;
        if (Input.take('a') || Input.take('b')) { Sound.sfx('cursor'); close(); }
      },
    };
    function close() { UI.remove(w); el.remove(); res(entries); }
    UI.push(w);
  });
}

// 時間の ゲージ（GAME_DATA.timeline）：地図の 画面で いつも 出す。いまの 時刻札の 位置に しるし、向きは ▶（前向き）／◀（さかさ）
//   canvas の そとの DOM なので、さかさの 画面の 反転（#screen の filter）が かからない＝いつも 同じ 色で 読める
let lastTimebar = '';
function setupTimebar() {
  const tl = DATA.timeline, el = $('#timebar'); if (!el) return;
  if (!tl) { el.remove(); return; }
  el.querySelector('.from').textContent = tl.from; el.querySelector('.to').textContent = tl.to;
  const tr = el.querySelector('.track');
  for (const h of tl.ticks || []) { const t = document.createElement('i'); t.className = 'tick'; t.style.left = ((h - tl.start) / (tl.end - tl.start) * 100) + '%'; tr.appendChild(t); }
}
function timebarState() {
  const tl = DATA.timeline;
  const show = !!(tl && G.mode === 'map' && G.map && G.flags && !G.picture && !G.pictureOut);
  if (!show) return { show };
  return { show, pos: tl.pos(G.flags), back: G.reversed, card: G.flags._card || '' };
}
function updateTimebar() {
  const el = $('#timebar'); if (!el) return;
  const s = timebarState();
  const key = s.show ? `${s.pos.toFixed(4)}|${s.back}|${s.card}` : 'off';
  if (key === lastTimebar) return;
  lastTimebar = key;
  el.classList.toggle('off', !s.show);
  if (!s.show) return;
  el.classList.toggle('back', s.back);
  const mk = el.querySelector('.mk');
  mk.style.left = (s.pos * 100) + '%';
  mk.querySelector('.ar').textContent = s.back ? '◀' : '▶';
  el.setAttribute('aria-label', `いまの 時刻：${s.card || '―'}（${s.back ? 'さかさ' : 'まえむき'}）`);
}

function snapshot() {
  const h = G.hero;

    const t = (tx >= 0 && ty >= 0 && tx < m.w && ty < m.h) ? m.grid[ty][tx] : m.outside;
    if (G.reversed && t.name === 'void') { ctx.fillStyle = '#fff'; ctx.fillRect(tx * TILE - ox, ty * TILE - oy, TILE, TILE); continue; }
    const fr = t.frames[Math.floor(G.clock * t.fps) % t.frames.length];

}

const PIC = {
  rect(c, x, y, w, h, col) { c.fillStyle = PALETTE[col] || col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
  sprite(c, rows, x, y, s = 1, pal) { const k = rows.join('|') + JSON.stringify(pal || {}); PIC._c[k] = PIC._c[k] || renderRows(rows, pal); const cv = PIC._c[k]; c.drawImage(cv, Math.round(x), Math.round(y), cv.width * s, cv.height * s); },
  char(c, id, dir, x, y, s = 1, frame = 0) { const f = charFrames(id)[dir][frame % 2]; c.drawImage(f, Math.round(x), Math.round(y), 16 * s, 16 * s); },
  enemy(c, id, x, y, s = 2) { const d = DATA.enemies[id]; const cv = enemyCanvas(d.sprite, d.pal); c.drawImage(cv, Math.round(x), Math.round(y), cv.width * s, cv.height * s); },

  circle(c, cx, cy, r, col) { c.fillStyle = PALETTE[col] || col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } },
  _c: {},
};

const STEP = 1 / 60;
let acc = 0, lastT = performance.now();
function update(dt) {
  G.clock += dt;
  Input.update(dt);
  UI.update(dt);
  if (G.mode === 'map' && G.map) {
    updateNPCs(dt);
    updateHero(dt);
    updateCamera(false);
  }
  updateFx(dt);
  G.waiters = G.waiters.filter(w => { if (w.fn()) { w.res(); return false; } return true; });
  Input.endStep();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (G.paused) { lastT = now; return; }
  let dt = (now - lastT) / 1000; lastT = now;
  dt = Math.min(dt, 0.25) * G.timeScale;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 240) { update(STEP); acc -= STEP; n++; }
  Sound.update();
  render();
  updateBtnLabels();
  updateTimebar();
  const th = $('#tapHint'); const show = !!G.tapWait; if (th.hidden === show) th.hidden = !show;
}
document.addEventListener('visibilitychange', () => {
  G.paused = document.hidden;
  Input.releaseAll();
  try { if (Sound.ctx) { if (document.hidden) Sound.ctx.suspend(); else Sound.ctx.resume(); } } catch (e) { /* 無視 */ }
  lastT = performance.now();
  if (G.mode === 'map' && G.scriptDepth === 0) autosave();
});

async function runSelfTests() {
  const E = window.Engine, results = [];
  const panel = document.createElement('div'); panel.id = 'testPanel'; document.body.appendChild(panel);
  const show = () => { panel.textContent = results.map(r => (r.ok ? '○ ' : '× ') + r.name + (r.err ? ' … ' + r.err : '')).join('\n'); };
  const timeout = (p, sec, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('時間切れ: ' + what)), sec * 1000))]);
  async function t(name, fn, sec = 40) {
    try { await timeout(Promise.resolve().then(fn), sec, name); results.push({ name, ok: true }); console.log('[test] ○', name); }
    catch (e) { results.push({ name, ok: false, err: e.message }); console.error('[test] ×', name, e); }
    show();
  }
  const ok = (v, msg) => { if (!v) throw new Error(msg || '期待と違う'); };
  const strong = () => Object.assign(G.hero, { lv: 6, hp: 999, mhp: 999, atk: 200, def: 60, agi: 99 });
  const run = async (s, choices = [], battle = []) => { G.autoChoices = choices.slice(); G.autoBattle = battle.slice(); await E.runScript(s, {}); await E.until(() => G.scriptDepth === 0); };
  const go = async (map, x, y, dir = 'down') => { await E.runScript([{ warp: map, x, y, dir }]); };
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 無視 */ }

  // ---------- データの静的な点検 ----------
  const D = DATA;
  // スクリプトの中身をすべて歩く（then/else/cases/win/lose/run/call）
  function walkCmds(list, fn, seen = new Set()) {
    if (typeof list === 'string') { if (seen.has(list)) return; seen.add(list); fn({ _ref: list }); list = D.scripts[list]; if (!list) return; }
    if (!Array.isArray(list)) return;
    for (const c of list) {
      fn(c);
      for (const k of ['then', 'else', 'win', 'lose', 'run']) if (c[k]) walkCmds(c[k], fn, seen);
      if (c.cases) c.cases.forEach(b => walkCmds(b, fn, seen));
      if (c.call) walkCmds(c.call, fn, seen);
    }
  }
  // マップに付いている全スクリプト
  function mapScripts(m) {
    const out = [];
    for (const n of m.npcs || []) { if (n.script) out.push(n.script); if (n.say) out.push([{ say: n.say }]); for (const v of n.variants || []) out.push(v.script || [{ say: v.say }]); }
    for (const o of m.objects || []) out.push(o.script || [{ say: o.say }]);
    for (const tr of m.triggers || []) out.push(tr.script);
    if (m.onEnter) out.push(m.onEnter);
    return out;
  }
  const allRoots = () => { const r = [D.start.script]; for (const m of Object.values(D.maps)) r.push(...mapScripts(m)); r.push(...Object.keys(D.scripts)); return r; };

  await t('データの形（タイル・人物・敵の絵・一枚絵）', () => {
    for (const n of Object.keys(TILE_DEFS)) tileInfo(n);
    for (const id of Object.keys(CHARACTERS)) { const f = charFrames(id); ok(f.down.length === 2 && f.left.length === 2 && f.up.length === 2, id); }
    for (const id of Object.keys(OBJECT_SPRITES)) charFrames(id);
    for (const [id, e] of Object.entries(D.enemies)) { ok(ENEMY_SPRITES[e.sprite], '敵の絵がない: ' + id); enemyCanvas(e.sprite, e.pal); }
    const cv = document.createElement('canvas').getContext('2d');
    for (const [id, fn] of Object.entries(D.pictures)) fn(cv, 192, 300, 1.5, PIC);
    ok(Object.keys(D.maps).length >= 8 && Object.keys(D.maps).length <= 10, 'マップの数 ' + Object.keys(D.maps).length);
    const pics = Object.keys(D.pictures).filter(k => k.startsWith('p_'));
    ok(pics.length >= 8 && pics.length <= 12, '一枚絵の数 ' + pics.length);
  });
  await t('マップ読込（凡例・ワープ先・端のワープ先が存在して範囲内）', () => {
    for (const [id, md] of Object.entries(D.maps)) {
      const m = E.buildMap(id);
      ok(m.w > 0 && m.h > 0, id);
      md.tiles.forEach((r, y) => ok(r.length === m.w, `${id} の ${y}行目の幅が ${r.length}（${m.w}であるべき）`));
      const chk = (to, x, y, what) => {
        ok(D.maps[to], `${what} の行き先 ${to} がない`);
        const dm = E.buildMap(to); ok(y < dm.h && x < dm.w, `${what}→${to} の座標が範囲外`);
        ok(!dm.grid[y][x].solid, `${what}→${to}(${x},${y}) が壁の中`);

  function cannotBypass(mapId, flags, start, exitRow) {

    try {
      const md = D.maps[mapId], m = E.buildMap(mapId);

        const [x, y] = q.shift();
        ok(y !== exitRow, `${mapId}: 場面を とおらずに 出口(${x},${y})へ 行ける`);
