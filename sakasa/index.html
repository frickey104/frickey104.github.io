  });
  await t('v1.2 これまでの はなし：とどいた 章より 先は 出ない・ネタばれしない・B で とじる', async () => {
    const keep = G.flags, keepItems = G.items;
    const allIf = {};
    const addIf = f => { if (typeof f === 'string') allIf[f.replace(/^!/, '')] = true; else if (Array.isArray(f)) f.forEach(addIf); else if (f && f.any) f.any.forEach(addIf); };
    for (const e of STORY_LOG) if (e.if !== undefined) addIf(e.if);
    try {
      for (let ch = 0; ch <= 9; ch++) {
        G.flags = Object.assign({}, allIf, { ch }); G.items = Object.assign({}, keepItems, { rope: 1 });
        const es = storyLogEntries();
        ok(es.length && es.every(e => e.ch <= ch), ch + '章で 先の 章が 出る');
        ok(es.some(e => e.ch === ch), ch + '章の 段が ない');
        const txt = es.map(e => e.text).join('');
        if (ch < 7) ok(!txt.includes('仮面の剣士は、おれ') && !txt.includes('こどもは、ミオ'), ch + '章で 剣士の 正体');
        if (ch < 6) ok(!txt.includes('ささやきは、ミオ'), ch + '章で 窓の 正体');
        if (ch < 5) ok(!txt.includes('かげは、ソウ'), ch + '章で 橋の かげの 正体');
        ok(es.every((e, i) => i === 0 || e.ch >= es[i - 1].ch), '順');
      }
      G.flags = { ch: 2 }; const t2 = storyLogEntries().map(e => e.text).join('');
      ok(!t2.includes('谷へ') && !t2.includes('ショール'), '二章の はじめに 橋の できごと');
      G.flags = { ch: 0 }; ok(storyLogEntries().length === 1, '序章の はじめ');
      // v1.2 レビュー #8：5:50 の 鐘は「朝」の 札の まえ／前向きの 章で 出ない 札（二日目 15:00）を 使わない／トキ婆は 本文どおり
      ok(!STORY_LOG[0].card && STORY_LOG.findIndex(e => e.card === '一日目 朝') === 1, '鐘の 段が 朝の 札の 下');
      ok(!STORY_LOG.some(e => e.ch <= 3 && e.card === '二日目 15:00'), '二章に 出ない 札');
      ok(STORY_LOG.some(e => e.text.includes('くぐれば、さかさに 生きる。 もどりたい日まで、ずっとな。')), 'トキ婆の ことばが 本文と ちがう');
    } finally { G.flags = keep; G.items = keepItems; }
    // 窓：B メニュー → これまでの はなし → B で とじる（本当の 入力）。さかさの 章でも 読める（DOM は 反転しない）
    G.auto = false;
    try {
      await place('village', 10, 6, 'down', { ch: 4, ch4v: true, tokiHide: true, readWall: true, _card: '◀ 三日目 ひる' }, true);   // readWall：「一日目 朝」の 札は 鐘の 段の あと（v1.2 レビュー #8②）
      await tap('b'); await E.until(() => document.querySelector('.win.field:not([hidden])'));
      const items = [...document.querySelectorAll('.win.field .item .t')].map(x => x.textContent);
      const idx = items.indexOf('これまでの はなし'); ok(idx >= 0, 'メニューに ない: ' + items.join('/'));
      for (let i = 0; i < idx; i++) { await tap('down'); await E.sleep(0.05); }
      await tap('a'); await E.until(() => document.querySelector('.win.storylog'));
      const lw = document.querySelector('.win.storylog');
      ok(lw.textContent.includes('◀ 三日目 夕方') && lw.textContent.includes('一日目 朝'), '札が 出ない');
      ok(!lw.textContent.includes('◀ 二日目 16:30') && !lw.textContent.includes('◀ 二日目 夜'), '先の 段が 出る');
      ok(getComputedStyle(lw).filter === 'none', '窓に 反転が かかる');
      ok(getComputedStyle(lw).overflowY === 'auto', 'スクロール できない');
      await tap('down'); await E.sleep(0.05);
      await tap('b'); await E.until(() => !document.querySelector('.win.storylog'));
      await E.until(() => document.querySelector('.win.field:not([hidden])'));
      await tap('b'); await E.until(() => !document.querySelector('.win.field') && G.scriptDepth === 0);
    } finally { G.auto = true; Input.releaseAll(); }
  }, 60);
  await t('v1.2 あたらしい 文に 使わない ことばが ない（「うら」は うら色・うらがえる だけ）', () => {
    const bad = ['逆行', '順行', '表の間', '裏の間', '裏口', '裏戸', '裏階段', '回転扉', '頭巾の子', '1周目', '2周目', '一周目', '二周目', '三周目'];
    const texts = [TIMELINE.from, TIMELINE.to, ...Object.keys(TIMELINE.cards), ...STORY_LOG.map(e => e.text), ...STORY_LOG.map(e => e.card || '')];
    for (const g of GLIMPSES) walkCmds(g.id, c => { if (c.say) texts.push(...[].concat(c.say)); });
    for (const s of ['village8', 'innWindow', 'passScene', 'bridgeBackScene', 'maskEvent', 'sayoMinato', 'crossing']) walkCmds(s, c => { if (c.say) texts.push(...[].concat(c.say)); });
    const hits = [];
    for (const tx of texts) {
      for (const w of bad) if (tx.includes(w)) hits.push(w + '：' + tx.slice(0, 16));
      if (/うら(?!色|がえ)/.test(tx)) hits.push('うら：' + tx.slice(0, 16));
    }
    ok(!hits.length, hits.join(' / '));
  });

  const pass = results.filter(r => r.ok).length;
  const line = `${pass}/${results.length} 合格`;
  console.log('[test] ' + line);
  panel.textContent = line + '\n' + panel.textContent;
  panel.classList.add(pass === results.length ? 'pass' : 'fail');
  document.title = line;
  window.TEST_RESULT = { pass, total: results.length, results };
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 無視 */ }
}

boot();
</script>
