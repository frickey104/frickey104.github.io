<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>frickey の工房</title>
<meta name="description" content="AI の仮想会社『CC カンパニー』で作っている、ブラウザで遊べるゲームと道具と小物。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="frickey の工房">
<meta property="og:title" content="frickey の工房">
<meta property="og:description" content="AI の仮想会社『CC カンパニー』で作っている、ブラウザで遊べるゲームと道具と小物。">
<meta property="og:url" content="https://frickey104.github.io/">
<meta property="og:image" content="https://frickey104.github.io/img/og-site.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 機械屋の作業机: 明るい方は方眼紙、暗い方は青焼き。作品は札（番号・種類・版）と、左上の状態のラベル（完成・途中・止めた）を付けて棚に並べる */
:root{
  --bg:#f3f6f7; --grid:#dfe7ec; --grid2:#c9d6de; --card:#ffffff; --ink:#15283b; --sub:#52667a; --line:#cfdae2;
  --accent:#1d6aa8; --accentInk:#ffffff; --stamp:#c2412d; --shadow:0 1px 0 #cfdae2, 0 8px 24px -16px #15283b55;
  --done:#2f8a4c; --doneInk:#ffffff; --wip:#f2c230; --wipInk:#3a2c00; --stop:#8a96a3; --stopInk:#ffffff;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f2740; --grid:#17344f; --grid2:#21476a; --card:#132f4c; --ink:#e7eff7; --sub:#9fb6cc; --line:#2a5277;
  --accent:#7cc0f5; --accentInk:#0b1d30; --stamp:#ff8a6b; --shadow:0 1px 0 #21476a, 0 10px 28px -18px #000;
  --done:#5cc47d; --doneInk:#06240f; --wip:#f5cf55; --wipInk:#3a2c00; --stop:#7b8794; --stopInk:#0b1d30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f2740; --grid:#17344f; --grid2:#21476a; --card:#132f4c; --ink:#e7eff7; --sub:#9fb6cc; --line:#2a5277;
  --accent:#7cc0f5; --accentInk:#0b1d30; --stamp:#ff8a6b; --shadow:0 1px 0 #21476a, 0 10px 28px -18px #000;
  --done:#5cc47d; --doneInk:#06240f; --wip:#f5cf55; --wipInk:#3a2c00; --stop:#7b8794; --stopInk:#0b1d30; color-scheme:dark}
*{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;background:var(--bg)}
html{min-height:100%;background-color:var(--bg);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
body{background:transparent}
.wrap{max-width:1040px;margin:0 auto;padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:44px}
a{color:inherit}
.tag{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;color:var(--sub);font-variant-numeric:tabular-nums}

/* 冒頭 */
header{display:flex;flex-direction:column;gap:10px;max-width:40em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
.lead{margin:0;font-size:1.05rem;color:var(--sub)}
.lead b{color:var(--ink);font-weight:700}
.news{margin:0;font-size:.92rem;color:var(--sub);border-left:3px solid var(--stamp);padding-left:10px}
.news b{color:var(--ink);margin-right:.6em}
.news span+span::before{content:"／";margin:0 .4em;color:var(--line)}

/* 棚 */
section{display:flex;flex-direction:column;gap:16px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2,h3{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card .pic{position:relative;display:block}
.card img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-bottom:1px solid var(--line);background:#0b0c14}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.card h4{margin:0;font-size:1.1rem;font-weight:700}
.big .card h4{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.25}
.card p{margin:0;font-size:.92rem;color:var(--sub)}
.go{align-self:flex-start;margin-top:auto;font-weight:700;background:var(--accent);color:var(--accentInk);padding:8px 16px;border-radius:4px}
.ext{font-family:var(--mono);font-size:.8rem}
a:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}

/* 状態のラベル（左上に1つ） */
.st{position:absolute;top:10px;left:10px;font-family:var(--body);font-weight:700;font-size:.78rem;line-height:1;padding:6px 10px;border-radius:999px;letter-spacing:.06em;box-shadow:0 1px 3px #0005}
.st-done .st{background:var(--done);color:var(--doneInk)}
.st-wip .st{background:var(--wip);color:var(--wipInk)}
.st-stop .st{background:var(--stop);color:var(--stopInk)}
.upd{font-family:var(--mono);font-size:.76rem;color:var(--ink);font-variant-numeric:tabular-nums}
.st-stop{opacity:.72}
.st-stop img{filter:grayscale(1)}

/* 作り方 */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:0;padding:0;list-style:none}
.how li{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.how b{display:block;font-weight:700;margin-bottom:2px}
.how span{color:var(--sub);font-size:.92rem}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:720px){
  .wrap{gap:36px;padding-block:28px 44px}
  .grid.big{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">@@TAG@@</span>
    <h1>frickey の工房</h1>
    <p class="lead">AI の仮想会社『CC カンパニー』で、<b>遊べるもの</b>を作っています。</p>
@@NEWS@@  </header>
@@SHELVES@@
  <section aria-labelledby="how">
    <div class="shelf-head"><h3 id="how">作り方</h3></div>
    <ul class="how">
      <li><b>1つのファイルで作る</b><span>画面も計算も説明も、1つの HTML に入れています。開けばそのまま動きます。</span></li>
      <li><b>何も送らない</b><span>ログインも登録もありません。遊んだ記録は、その端末の中だけに残ります。</span></li>
      <li><b>作りかけも出す</b><span>左上の札が、完成（緑）・途中（黄）・止めた（灰）。途中のものは「試作2版」のように版と更新日を書いています。</span></li>
    </ul>
  </section>

  <footer><span class="tag">© frickey</span><a class="tag" href="https://github.com/frickey104">github.com/frickey104</a></footer>
</div>
</body>
</html>
