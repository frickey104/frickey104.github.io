<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>描くと鳴る — Draw / Sound</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2307070d'/><path d='M3 16q5-11 8 0t8 0t8 0' fill='none' stroke='%23b48cff' stroke-width='2.6' stroke-linecap='round'/><circle cx='19' cy='16' r='3' fill='%23e6d8ff'/></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#07070d;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #hint{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));
    max-width:min(72ch,calc(100vw - 460px));color:#7e86a3;font-size:12.5px;line-height:1.9;
    letter-spacing:.02em;pointer-events:none;transition:opacity 1.2s ease;text-shadow:0 1px 8px #000;}
  #hint b{color:#dfe3f7;font-weight:600;}
  #hint.off{opacity:0;}
  #flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#dfe3f7;
    font-size:14px;letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity .35s ease;
    text-shadow:0 2px 12px #000;}
  #flash.on{opacity:1;}
  /* ボタン類より前に出す（最初の一手を確実に受ける） */
  #gate{position:fixed;inset:0;display:grid;place-items:center;background:#07070d;
    color:#dfe3f7;font-size:15px;letter-spacing:.06em;cursor:pointer;z-index:20;text-align:center;line-height:2.1;}
  #gate small{color:#7e86a3;font-size:12.5px;}
  /* 戻る導線・画面上の操作ボタン（4本共通） */
  #back{position:fixed;z-index:30;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));
    display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 16px;
    border-radius:999px;border:1px solid #2a3050;background:rgba(7,7,13,.62);
    color:#7e86a3;font-size:13px;letter-spacing:.04em;text-decoration:none;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:color .2s,border-color .2s;}
  #back:hover,#back:focus-visible{color:#dfe3f7;border-color:#4a5480;}
  #ctl{position:fixed;z-index:10;right:calc(14px + env(safe-area-inset-right));
    bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;
    gap:8px;max-width:min(70vw,460px);pointer-events:none;}
  #ctl button{pointer-events:auto;min-height:44px;min-width:44px;box-sizing:border-box;padding:0 14px;
    border-radius:999px;border:1px solid #2a3050;background:rgba(7,7,13,.62);
    color:#7e86a3;font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:color .2s,border-color .2s;}
  #ctl button:hover{color:#dfe3f7;border-color:#4a5480;}
  #ctl button:focus-visible{outline:2px solid #6f7cb8;outline-offset:2px;color:#dfe3f7;}
  #ctl button[aria-pressed="true"]{color:#dfe3f7;border-color:#6f7cb8;background:rgba(52,62,110,.58);}
  /* 狭い画面では案内をボタンの上へ逃がす（375px でも重ならない） */
  @media (max-width:820px){
    #ctl{left:calc(14px + env(safe-area-inset-left));max-width:none;}
    #hint{max-width:none;right:calc(18px + env(safe-area-inset-right));
      bottom:calc(16px + env(safe-area-inset-bottom) + 116px);}
  }
</style>

<body>
<a id="back" href="index.html">← 実験室</a>
<canvas id="c" role="img" aria-label="描くと鳴る。線を描くとその形が音になり、繰り返し鳴り続けるインタラクティブ作品"></canvas>
<div id="hint">
  <b>ドラッグして線を描く</b> — <b>高さ＝音程 ／ 速さ＝音色 ／ 長さ＝ループの長さ</b><br>
  描いた線はそのまま繰り返し鳴り続ける。重ねるほど和音になる<br>
  <b>1〜4</b> 音色 ／ <b>Z</b> 直前を消す ／ <b>C</b> 全部消す ／ <b>Space</b> 止める ／ <b>H</b> この案内
</div>
<div id="flash"></div>
<div id="ctl" role="toolbar" aria-label="操作">
  <button type="button" id="b-timbre">音色</button>
  <button type="button" id="b-undo">ひとつ戻す</button>
  <button type="button" id="b-clear">全部消す</button>
  <button type="button" id="b-pause">止める</button>
  <button type="button" id="b-hint">案内</button>
</div>
<div id="gate"><span id="gatemsg">クリックして音を出す</span><br><small>ブラウザの制約で、最初の一手だけ必要です</small></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint');
const flashEl = document.getElementById('flash');
const gate = document.getElementById('gate');

let W=0,H=0,DPR=1;
let ac=null, master=null, verbBus=null;
let loops = [];        // 確定した線（鳴り続ける）
let cur = null;        // 描画中の線
let paused = false;
let timbre = 0;
const MAX_LOOPS = 40;  // 声は鳴りっぱなしなので上限を設ける（超えたら古い線から落とす）
const TIMBRES = ['sine','triangle','sawtooth','square'];
const TIMBRE_NAME = ['まる（sine）','角のとれた三角','ざらつく鋸','四角い矩形'];

/* ペンタトニック（外さない音階） */
const SCALE = [0,2,4,7,9];
function yToFreq(y){
  const t = 1 - (y / H);                    // 下=低い / 上=高い
  const semi = Math.round(t * 34);          // 約3オクターブ
  const oct = Math.floor(semi / SCALE.length);
  const deg = SCALE[semi % SCALE.length];
  return 110 * Math.pow(2, (oct*12 + deg) / 12);
}

/* ---------- audio ---------- */
function initAudio(){
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain();
  master.gain.value = 0.0;
  master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.9, ac.currentTime + 0.8);

  // 簡易リバーブ（インパルス応答をその場で合成）
  const len = ac.sampleRate * 2.6;
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for (let i=0;i<len;i++){
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
    }
  }
  const conv = ac.createConvolver(); conv.buffer = buf;
  const wet = ac.createGain(); wet.gain.value = 0.34;
  conv.connect(wet); wet.connect(master);
  verbBus = conv;
}

/* 1本の線＝1つの声。線に沿って音程が動き、端まで行ったら戻る */
function makeVoice(line){
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  const filt = ac.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 2200;
  filt.Q.value = 1.1;

  osc.type = TIMBRES[line.timbre];
  gain.gain.value = 0;
  osc.connect(filt); filt.connect(gain);
  gain.connect(master); gain.connect(verbBus);
  osc.start();
  return { osc, gain, filt, phase: Math.random(), dir: 1 };
}

function killVoice(v){
  if (!v) return;
  try {
    v.gain.gain.cancelScheduledValues(ac.currentTime);
    v.gain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
    v.osc.stop(ac.currentTime + 0.5);
  } catch(_){}
}

/* ---------- 線 ---------- */
function newLine(x,y){
  return { pts:[[x,y]], timbre, hue: (performance.now()*0.06) % 360, voice:null, head:0 };
}

/* 声の後始末はここ1か所だけ。Z / C / 上限の追い出し が同じ道を通る */
function removeLoop(L){
  if (!L) return;
  killVoice(L.voice);
  L.voice = null;
}
function evictOldest(){
  let dropped = 0;
  while (loops.length > MAX_LOOPS){ removeLoop(loops.shift()); dropped++; }
  return dropped;
}

function commit(line){
  if (line.pts.length < 4){ return; }
  line.voice = makeVoice(line);
  loops.push(line);
  const dropped = evictOldest();
  flash(dropped ? `${loops.length} 本目（古い線を${dropped}本消した）` : `${loops.length} 本目`);
}

/* ---------- 更新：各線のヘッドを進め、音を追従させる ---------- */
function updateAudio(){
  if (!ac || paused) return;
  const t = ac.currentTime;
  for (const L of loops){
    const v = L.voice; if (!v) continue;
    const n = L.pts.length;
    // 線が長いほどゆっくり一周する
    const speed = 0.55 / Math.max(12, n);
    v.phase += speed * v.dir;
    if (v.phase >= 1){ v.phase = 1; v.dir = -1; }
    if (v.phase <= 0){ v.phase = 0; v.dir = 1; }

    const idx = Math.min(n-1, Math.max(0, Math.floor(v.phase*(n-1))));
    L.head = idx;
    const p = L.pts[idx];

    const f = yToFreq(p[1]);
    v.osc.frequency.setTargetAtTime(f, t, 0.035);

    // 描いたときの速さ＝明るさ（フィルタ）
    const sp = L.speedAt ? L.speedAt[idx] : 4;
    v.filt.frequency.setTargetAtTime(500 + Math.min(6500, sp*260), t, 0.06);

    // 同時に鳴る本数で音量を割る（増やしても割れない）
    const g = 0.22 / Math.sqrt(loops.length);
    v.gain.gain.setTargetAtTime(g, t, 0.08);
  }
}

/* ---------- 描画 ---------- */
function strokePath(pts, style, lw, alpha){
  if (pts.length < 2) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = style; ctx.lineWidth = lw;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function render(){
  ctx.fillStyle = 'rgba(7,7,13,0.30)';
  ctx.fillRect(0,0,W,H);

  // 音階のガイド（うっすら）
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#6d78a8'; ctx.lineWidth = 1;
  for (let s=0;s<35;s++){
    const y = H * (1 - s/34);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  for (const L of loops){
    strokePath(L.pts, `hsl(${L.hue} 70% 46%)`, 2.2*DPR, 0.42);
    const p = L.pts[L.head];
    if (p){
      // 再生ヘッド
      const g = ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],26*DPR);
      g.addColorStop(0, `hsl(${L.hue} 95% 78% / 0.95)`);
      g.addColorStop(1, `hsl(${L.hue} 95% 60% / 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p[0],p[1],26*DPR,0,Math.PI*2); ctx.fill();
    }
  }
  if (cur) strokePath(cur.pts, `hsl(${cur.hue} 90% 66%)`, 2.6*DPR, 0.9);
  ctx.globalCompositeOperation = 'source-over';
}

function loop(){
  requestAnimationFrame(loop);
  // 起動時に枠が非表示だと 0 サイズで初期化されるため、実サイズがついたら作り直す
  if (Math.max(2,Math.floor(innerWidth*DPR)) !== W || Math.max(2,Math.floor(innerHeight*DPR)) !== H) resize();
  updateAudio();
  render();
}

/* ---------- 入力 ---------- */
function pos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR]; }
let drawing=false;

cv.addEventListener('pointerdown', e=>{
  e.preventDefault();                    // タッチのパンに持っていかれないように
  if (!ac) return;
  const [x,y]=pos(e);
  // 先に状態を作る。setPointerCapture は環境によって例外を投げるため、
  // 後に置くと「線が無言で壊れる」（2026-08-18 検証で実際に踏んだ）
  cur = newLine(x,y);
  cur.speedAt = [0];
  drawing = true;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e=>{
  if (!drawing || !cur) return;
  const [x,y]=pos(e);
  const last = cur.pts[cur.pts.length-1];
  const d = Math.hypot(x-last[0], y-last[1]);
  if (d < 3*DPR) return;
  cur.pts.push([x,y]);
  cur.speedAt.push(d);
  if (cur.pts.length > 900) finish();
});
function finish(){
  if (cur) commit(cur);
  cur = null; drawing = false;
}
cv.addEventListener('pointerup', finish);
cv.addEventListener('pointerleave', ()=>{ if(drawing) finish(); });
// OS にジェスチャを取り消されても、描きかけの線を落とさない
cv.addEventListener('pointercancel', ()=>{ if(drawing) finish(); });

function flash(m){ flashEl.textContent=m; flashEl.classList.add('on');
  clearTimeout(flash._t); flash._t=setTimeout(()=>flashEl.classList.remove('on'),900); }

/* ---------- 操作（キーもボタンも同じ関数を通る） ---------- */
function togglePause(){
  paused=!paused;
  if (master) master.gain.setTargetAtTime(paused?0:0.9, ac.currentTime, 0.08);
  flash(paused?'止めた':'鳴らす');
}
function undoLast(){ const L=loops.pop(); if(L){ removeLoop(L); flash('1本消した'); } }
function clearAll(){
  for(const L of loops) removeLoop(L);
  loops=[];
  ctx.fillStyle='#07070d'; ctx.fillRect(0,0,W,H);
  flash('全部消した');
}
function setTimbre(i){ timbre = i; flash(TIMBRE_NAME[timbre]); }
function cycleTimbre(){ setTimbre((timbre+1) % TIMBRES.length); }
function toggleHint(){ hintEl.classList.toggle('off'); }

addEventListener('keydown', e=>{
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;                        // Ctrl+C で作品を消さない
  if (e.target && e.target.closest && e.target.closest('#ctl,#back')) return;
  const k=e.key.toLowerCase();
  if (k===' '){ e.preventDefault(); togglePause(); }
  else if (k==='z'){ undoLast(); }
  else if (k==='c'){ clearAll(); }
  else if (k==='h'){ toggleHint(); }
  else if (k>='1'&&k<='4'){ setTimbre((+k)-1); }
});

/* ---------- 画面上のボタン（押したら blur して Space の再発火を防ぐ） ---------- */
function bind(id, fn){
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', () => { fn(); el.blur(); });
}
bind('b-timbre', cycleTimbre);
bind('b-undo',   undoLast);
bind('b-clear',  clearAll);
bind('b-pause',  togglePause);
bind('b-hint',   toggleHint);

/* タブに戻ったとき、AudioContext が止まったままにならないように */
addEventListener('visibilitychange', ()=>{
  if (!document.hidden && ac && ac.state === 'suspended'){
    try { const p = ac.resume(); if (p && p.catch) p.catch(()=>{}); } catch(_){}
  }
});

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.5);
  W = Math.max(2, Math.floor(innerWidth*DPR)); H = Math.max(2, Math.floor(innerHeight*DPR));
  cv.width=W; cv.height=H;
  ctx.fillStyle='#07070d'; ctx.fillRect(0,0,W,H);
}
addEventListener('resize', ()=>{ clearTimeout(resize._t); resize._t=setTimeout(resize,180); });

/* ---------- 起動（音は最初のクリック後） ---------- */
// 触る端末には「タップ」と言う（クリックできる装置がない）
(function gateCopy(){
  const msg = document.getElementById('gatemsg');
  if (!msg) return;
  const touchLike = (window.matchMedia && matchMedia('(hover:none)').matches) || ('ontouchstart' in window);
  if (touchLike) msg.textContent = 'タップして音を出す';
})();
gate.addEventListener('click', () => {
  initAudio();
  gate.style.display='none';
  setTimeout(()=>hintEl.classList.add('off'), 8000);
}, { once:true });

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
